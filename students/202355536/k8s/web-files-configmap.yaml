    .code-input { width: 130px; text-transform: uppercase; letter-spacing: 4px; font-family: var(--font-title); text-align: center; }
    .room-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
