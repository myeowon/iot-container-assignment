  library-decor.js: |
    // 도서관 공간 장식: 책장·통유리 창·벽 조명·라운지 의자·화분. 좌표는 각 물건의 바닥 중심 기준.
    import * as THREE from 'three';
    import { METAL, OAK, WHITE } from './furniture.js';
    import { box, cyl, group, mat } from './mesh.js';

    const BOOK_COLORS = ['#f4f1ea', '#e9e4da', '#c94f45', '#3f5f8a', '#e0b84a', '#5f8a6a', '#2f3a4a', '#d98a6a', '#8a6fb0', '#f0d9b5'];

    /** 칸칸이 책이 꽂힌 원목 책장. 길이 방향은 x, 책이 보이는 면은 +z. 책은 InstancedMesh 하나로 그린다. */
    export function libraryShelf(length, height = 3.2, depth = 0.45) {
      const cols = Math.round(length / 0.9);
      const rows = Math.round(height / 0.5);
      const cellW = length / cols;
      const cellH = height / rows;
      const g = group(
        box(length, height, 0.04, OAK, [0, height / 2, -depth / 2]),
        ...Array.from({ length: rows + 1 }, (_, r) => box(length, 0.04, depth, OAK, [0, r * cellH, 0])),
        ...Array.from({ length: cols + 1 }, (_, c) => box(0.04, height, depth, OAK, [-length / 2 + c * cellW, height / 2, 0])),
      );

      const books = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let x = -length / 2 + c * cellW + 0.04;
          const end = x + (cellW - 0.08) * (0.4 + Math.random() * 0.6);   // 칸마다 채운 정도가 다르게
          while (x < end) {
            const w = 0.035 + Math.random() * 0.035;
            const h = cellH * (0.6 + Math.random() * 0.3);
            books.push({ x: x + w / 2, y: r * cellH + 0.02 + h / 2, w, h });
            x += w + 0.004;
          }
        }
      }
      const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), mat('#ffffff'), books.length);
      const m = new THREE.Matrix4();
      books.forEach((b, i) => {
        m.compose(new THREE.Vector3(b.x, b.y, 0.02), new THREE.Quaternion(), new THREE.Vector3(b.w, b.h, depth * 0.75));
        mesh.setMatrixAt(i, m);
        mesh.setColorAt(i, new THREE.Color(BOOK_COLORS[Math.floor(Math.random() * BOOK_COLORS.length)]));
      });
      mesh.castShadow = mesh.receiveShadow = true;
      g.add(mesh);
      return g;
    }

    /** 통유리 창 벽. 길이 방향은 x, 실내는 +z. 가운데에 흰 기둥. */
    export function windowWall(length, height) {
      const frame = mat('#2e3136', { metalness: 0.4, roughness: 0.5 });
      const glass = new THREE.Mesh(
        new THREE.PlaneGeometry(length, height),
        new THREE.MeshStandardMaterial({ color: '#d8eef5', transparent: true, opacity: 0.1, roughness: 0.05, depthWrite: false }));
      glass.position.y = height / 2;
      const mullions = Math.round(length / 1.6);
      return group(
        glass,
        ...Array.from({ length: mullions + 1 }, (_, i) => box(0.1, height, 0.12, frame, [-length / 2 + (i * length) / mullions, height / 2, 0])),
        ...[0.04, 2.5, 4.3, height - 0.05].map((y) => box(length, 0.1, 0.12, frame, [0, y, 0])),
        box(length, 0.5, 0.6, WHITE, [0, height + 0.2, 0.2]),                          // 천장 보
        box(0.7, height, 0.7, WHITE, [0, height / 2, 0.3]),                            // 가운데 기둥
      );
    }

    /**
     * 벽 조명(업라이트): 벽에 붙는 황동 받침 + 반원 갓. 실내 쪽은 +z.
     * withLight가 false면 빛나는 갓만 둔다 (점광원이 많으면 렌더링이 무거워진다).
     */
    export function wallSconce({ withLight = true } = {}) {
      const brass = mat('#b08d4a', { metalness: 0.6, roughness: 0.4 });
      const shadeMaterial = new THREE.MeshStandardMaterial({
        color: '#f3dfbf', emissive: '#ffcf8a', emissiveIntensity: 1, side: THREE.DoubleSide, roughness: 0.6,
      });
      const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.12, 0.2, 20, 1, true, -Math.PI / 2, Math.PI), shadeMaterial);
      bowl.position.z = 0.02;
      const object = group(box(0.1, 0.3, 0.03, brass, [0, -0.08, 0.015]), bowl);
      const light = withLight ? new THREE.PointLight('#ffc27a', 1, 4, 1.8) : null;
      if (light) {
        light.position.set(0, 0.3, 0.3);
        object.add(light);
      }
      return {
        object,
        setLevel(level) {
          if (light) light.intensity = 0.1 + level * 1.6;
          shadeMaterial.emissiveIntensity = 0.15 + level * 0.9;
        },
      };
    }

    /** 창가 가죽 라운지 의자 (등받이가 -z, 앉는 사람은 +z를 본다) */
    export function armchair() {
      const leather = mat('#8a4b2a', { roughness: 0.55 });
      const back = box(0.8, 0.7, 0.16, leather, [0, 0.85, -0.3]);
      back.rotation.x = -0.15;
      return group(
        box(0.8, 0.2, 0.7, leather, [0, 0.45, 0]),
        back,
        box(0.14, 0.3, 0.6, leather, [-0.42, 0.62, 0]),
        box(0.14, 0.3, 0.6, leather, [0.42, 0.62, 0]),
        cyl(0.04, 0.04, 0.35, METAL, [0, 0.18, 0], 8),
        cyl(0.32, 0.32, 0.03, METAL, [0, 0.02, 0], 16),
      );
    }

    export function sideTable() {
      return group(cyl(0.3, 0.3, 0.04, WHITE, [0, 0.55, 0], 24), cyl(0.03, 0.03, 0.55, METAL, [0, 0.27, 0], 8));
    }

    export function plant(scale = 1) {
      const leaves = new THREE.MeshStandardMaterial({ color: '#5f9a55', roughness: 0.9, flatShading: true });
      const g = group(cyl(0.28, 0.22, 0.5, WHITE, [0, 0.25, 0]));
      [[0, 1.0, 0, 0.42], [0.22, 0.8, 0.1, 0.32], [-0.2, 0.85, -0.08, 0.34], [0.05, 1.3, 0.05, 0.28]].forEach(([x, y, z, r]) => {
        const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), leaves);
        leaf.position.set(x, y, z);
        leaf.castShadow = true;
        g.add(leaf);
      });
      g.scale.setScalar(scale);
      return g;
    }
  lofi.js: |
    // Web Audio로 직접 만드는 lo-fi 루프 (음원 파일 없음 → 저작권 걱정 없음)
    // 코드 진행 + 베이스 + 스윙 드럼 + 바이닐 노이즈

    const BPM = 72;
    const BEAT = 60 / BPM;
    const CHORDS = [   // Fmaj7 → Em7 → Dm7 → Cmaj7 (MIDI 번호)
      [53, 57, 60, 64], [52, 55, 59, 62], [50, 53, 57, 60], [48, 52, 55, 59],
    ];
    const LOOKAHEAD = 0.2;   // 초 단위로 미리 예약

    const freq = (midi) => 440 * 2 ** ((midi - 69) / 12);

    export function createLofi() {
      let ctx = null;
      let master = null;
      let timer = null;
      let nextStep = 0;      // 다음 8분음표 시각
      let step = 0;
      let volume = 0.6;

      function noiseBuffer(seconds, crackle = false) {
        const buf = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = crackle ? (Math.random() < 0.0004 ? Math.random() * 2 - 1 : (Math.random() * 2 - 1) * 0.04)
            : Math.random() * 2 - 1;
        }
        return buf;
      }

      function tone(type, f, start, length, gain, cutoff = 1800) {
        const osc = ctx.createOscillator();
        const amp = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        osc.type = type;
        osc.frequency.value = f;
        osc.detune.value = (Math.random() - 0.5) * 12;   // 살짝 어긋난 음정이 테이프 느낌
        filter.type = 'lowpass';
        filter.frequency.value = cutoff;
        amp.gain.setValueAtTime(0, start);
        amp.gain.linearRampToValueAtTime(gain, start + 0.03);
        amp.gain.exponentialRampToValueAtTime(0.0001, start + length);
        osc.connect(filter).connect(amp).connect(master);
        osc.start(start);
        osc.stop(start + length + 0.05);
      }

      function hit(start, { cutoff, type, gain, length }) {
        const src = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        const amp = ctx.createGain();
        src.buffer = noiseBuffer(length);
        filter.type = type;
        filter.frequency.value = cutoff;
        amp.gain.setValueAtTime(gain, start);
        amp.gain.exponentialRampToValueAtTime(0.0001, start + length);
        src.connect(filter).connect(amp).connect(master);
        src.start(start);
      }

      function kick(start) {
        const osc = ctx.createOscillator();
        const amp = ctx.createGain();
        osc.frequency.setValueAtTime(110, start);
        osc.frequency.exponentialRampToValueAtTime(40, start + 0.25);
        amp.gain.setValueAtTime(0.55, start);
        amp.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
        osc.connect(amp).connect(master);
        osc.start(start);
        osc.stop(start + 0.4);
      }

      /** 8분음표 하나(한 마디 = 8스텝)를 예약 */
      function schedule(s, time) {
        const beatInBar = s % 8;
        const chord = CHORDS[Math.floor(s / 8) % CHORDS.length];
        if (beatInBar === 0) chord.forEach((n) => tone('triangle', freq(n), time, BEAT * 3.8, 0.07));
        if (beatInBar === 0 || beatInBar === 5) tone('sine', freq(chord[0] - 12), time, BEAT * 1.5, 0.22, 400);
        if (beatInBar % 2 === 1 && Math.random() < 0.35) {
          tone('sine', freq(chord[Math.floor(Math.random() * 4)] + 12), time, BEAT, 0.04, 2500);
        }
        if (beatInBar === 0 || beatInBar === 5) kick(time);
        if (beatInBar === 2 || beatInBar === 6) hit(time, { type: 'bandpass', cutoff: 1800, gain: 0.18, length: 0.18 });
        hit(time, { type: 'highpass', cutoff: 7000, gain: 0.05, length: 0.05 });
      }

      function tick() {
        while (nextStep < ctx.currentTime + LOOKAHEAD) {
          const swing = step % 2 ? BEAT * 0.08 : 0;   // 뒷박을 살짝 늦게
          schedule(step, nextStep + swing);
          nextStep += BEAT / 2;
          step++;
        }
      }

      function vinyl() {
        const src = ctx.createBufferSource();
        const amp = ctx.createGain();
        src.buffer = noiseBuffer(4, true);
        src.loop = true;
        amp.gain.value = 0.25;
        src.connect(amp).connect(master);
        src.start();
      }

      return {
        get playing() { return timer !== null; },
        async play() {
          if (!ctx) {
            ctx = new AudioContext();
            const warm = ctx.createBiquadFilter();
            warm.type = 'lowpass';
            warm.frequency.value = 4200;
            master = ctx.createGain();
            master.gain.value = volume * 0.8;
            master.connect(warm).connect(ctx.destination);
            vinyl();
          }
          await ctx.resume();
          nextStep = ctx.currentTime + 0.1;
          timer = setInterval(tick, 50);
        },
        pause() {
          clearInterval(timer);
          timer = null;
          ctx?.suspend();
        },
        setVolume(v) {
          volume = v;
          if (master) master.gain.value = v * 0.8;
        },
        close() {
          this.pause();
          ctx?.close();
          ctx = null;
        },
      };
    }
  mesh.js: |
    // 3D 도형·재질 헬퍼 (재질은 색별로 캐시해서 재사용)
    import * as THREE from 'three';

    const cache = new Map();

    export function mat(color, extra = {}) {
      const key = color + JSON.stringify(extra);
      if (!cache.has(key)) cache.set(key, new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...extra }));
      return cache.get(key);
    }

    /** 빛나는 재질 (블룸 효과로 번져 보인다) */
    export const glow = (color, intensity = 2) => mat(color, { emissive: color, emissiveIntensity: intensity });

    /** 봉제인형 느낌의 털/천 재질 */
    export function plush(color) {
      const key = `plush${color}`;
      if (!cache.has(key)) {
        cache.set(key, new THREE.MeshPhysicalMaterial({
          color, roughness: 0.95, sheen: 1, sheenRoughness: 0.6, sheenColor: new THREE.Color(color).lerp(new THREE.Color('#ffffff'), 0.5),
        }));
      }
      return cache.get(key);
    }

    function place(mesh, [x, y, z]) {
      mesh.position.set(x, y, z);
      mesh.castShadow = mesh.receiveShadow = true;
      return mesh;
    }

    const asMaterial = (m) => (m instanceof THREE.Material ? m : mat(m));

    export const box = (w, h, d, m, pos = [0, 0, 0]) =>
      place(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), asMaterial(m)), pos);

    export const cyl = (rTop, rBottom, h, m, pos = [0, 0, 0], segments = 20) =>
      place(new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBottom, h, segments), asMaterial(m)), pos);

    export function sphere(r, m, pos = [0, 0, 0], scale = [1, 1, 1]) {
      const mesh = place(new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), asMaterial(m)), pos);
      mesh.scale.set(...scale);
      return mesh;
    }

    export const capsule = (r, len, m, pos = [0, 0, 0]) =>
      place(new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 6, 12), asMaterial(m)), pos);

    export function group(...children) {
      const g = new THREE.Group();
      g.add(...children);
      return g;
    }
  planner-page.js: |
    // 플래너 페이지: 최근 7일 공부시간 막대 + 종이 플래너 시트 + 과목·할 일 관리
    import { get } from './api.js';
    import { createPlanner } from './planner-view.js';
    import { mountShell } from './shell.js';
    import { fmtDate, fmtShort, h } from './ui.js';

    export function mountPlannerPage(root, ctx) {
      const shell = mountShell(root, ctx, 'planner');
      const week = h('div', { class: 'card week' });
      const box = h('div');
      let days = [];
      let selected = null;

      shell.main.append(
        h('div', { class: 'page-head' },
          h('div', {}, h('span', { class: 'eyebrow' }, '하루를 쌓는 작은 습관'), h('h1', {}, '플래너'),
            h('p', {}, '오늘 할 일과 공부할 시간을 정리해보세요.'))),
        week,
        box);

      const planner = createPlanner(box, {
        onChange: (d) => {
          selected = d.day.date;
          if (d.editable) shell.setToday(d.study.totalSec);
          loadWeek();
        },
      });

      /** 최근 7일: 막대 높이 = 공부시간 (가장 많이 한 날 기준), 누르면 그날 기록 */
      async function loadWeek() {
        try {
          days = (await get('/planner/history')).days;
        } catch {
          return;
        }
        const max = Math.max(3600, ...days.map((d) => d.totalSec));
        week.replaceChildren(
          h('div', { class: 'sheet-label' }, '최근 7일'),
          h('div', { class: 'week-bars' }, days.map((d) => h('button', {
            class: `week-day${d.date === selected ? ' on' : ''}`, title: `${fmtDate(d.date)} · 할 일 ${d.done}/${d.planned}`,
            onClick: () => planner.load(d.date),
          },
          h('span', { class: 'week-bar' }, h('i', { style: `height:${(d.totalSec / max) * 100}%` })),
          h('strong', {}, fmtShort(d.totalSec)),
          h('small', {}, fmtDate(d.date))))));
      }

      planner.load();
      return () => shell.destroy();
    }
  planner-sheet.js: |
    // 종이 플래너 한 장: TODAY'S(날짜 이동) · D-DAY · TOTAL TIME · 오늘의 한마디 · CONTENTS · TIMETABLE
    import { timetable } from './timetable.js';
    import { fmtDate, fmtShort, h, shiftDate } from './ui.js';

    const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
    const DAY_MS = 86_400_000;

    /** 1 → 1st, 2 → 2nd, 11 → 11th, 23 → 23rd */
    function ordinal(n) {
      if (n % 100 >= 11 && n % 100 <= 13) return `${n}th`;
      return n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] ?? 'th');
    }

    const parts = (ymd) => [Number(ymd.slice(0, 4)), Number(ymd.slice(4, 6)), Number(ymd.slice(6, 8))];
    const toInputDate = (ymd) => ymd.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3');

    /** 20261030 → "OCT. 30th" */
    function paperDate(ymd) {
      const [, month, day] = parts(ymd);
      return `${MONTHS[month - 1]}. ${ordinal(day)}`;
    }

    /** 기준 날짜에서 D-DAY까지: "D-12" / "D-DAY" / "D+3" */
    function ddayText(target, from) {
      const utc = (ymd) => { const [y, m, d] = parts(ymd); return Date.UTC(y, m - 1, d); };
      const days = Math.round((utc(target) - utc(from)) / DAY_MS);
      return days === 0 ? 'D-DAY' : days > 0 ? `D-${days}` : `D+${-days}`;
    }

    /**
     * @param data    GET /api/planner 응답
     * @param actions { load(date), toggleDone(task), saveDaily(patch), saveTimetable(cells), saveDday(title, date) }
     */
    export function plannerSheet(data, actions) {
      const { day, editable } = data;
      const subjectOf = (id) => data.subjects.find((s) => s.id === id);

      const dateBox = h('div', { class: 'sheet-box sheet-date' },
        h('div', { class: 'sheet-label' }, "TODAY'S"),
        h('div', { class: 'date-nav' },
          h('button', { class: 'icon', title: '전날', onClick: () => actions.load(shiftDate(day.date, -1)) }, '◀'),
          h('strong', { class: 'hand big' }, paperDate(day.date)),
          h('button', { class: 'icon', title: '다음 날', disabled: editable, onClick: () => actions.load(shiftDate(day.date, 1)) }, '▶')),
        h('small', {}, editable ? `오늘 · ${fmtDate(day.date)}` : `지난 기록 · ${fmtDate(day.date)}`),
        !editable && h('button', { class: 'chip-btn', onClick: () => actions.load() }, '오늘로'));

      const ddayBox = h('details', { class: 'sheet-box sheet-dday' },
        h('summary', {},
          h('div', { class: 'sheet-label' }, 'D-DAY'),
          h('strong', { class: 'hand big' }, data.dday ? ddayText(data.dday.date, day.date) : '－'),
          h('small', {}, data.dday?.title ?? '눌러서 설정')),
        h('form', { class: 'stack', onSubmit: (e) => {
          e.preventDefault();
          const f = new FormData(e.target);
          actions.saveDday(f.get('title'), String(f.get('date')).replaceAll('-', ''));
        } },
        h('input', { name: 'title', placeholder: '예: 정보처리기사', maxLength: 20, value: data.dday?.title ?? '' }),
        h('input', { name: 'date', type: 'date', value: data.dday ? toInputDate(data.dday.date) : '' }),
        h('button', { class: 'btn small', type: 'submit' }, '저장 (이름을 비우면 해제)')));

      const goal = day.goalMin * 60;
      const totalBox = h('div', { class: 'sheet-box sheet-total' },
        h('div', { class: 'sheet-label' }, 'TOTAL TIME'),
        h('strong', { class: 'hand big' }, fmtShort(data.study.totalSec)),
        h('label', { class: 'goal' }, '목표',
          h('input', { type: 'number', min: 0, max: 1440, step: 10, value: day.goalMin, disabled: !editable,
            onChange: (e) => actions.saveDaily({ goalMin: Number(e.target.value) }) }), '분'),
        h('div', { class: 'progress' }, h('div', { class: 'bar' },
          h('span', { style: `width:${goal ? Math.min(100, (data.study.totalSec / goal) * 100) : 0}%` }))));

      const memo = h('label', { class: 'sheet-memo' },
        h('span', { class: 'sheet-label' }, '오늘의 한마디'),
        h('input', { class: 'hand', value: day.memo, maxLength: 200, disabled: !editable,
          placeholder: editable ? '오늘의 다짐이나 메모를 적어요' : '',
          onChange: (e) => actions.saveDaily({ memo: e.target.value }) }));

      return h('section', { class: `card sheet${editable ? '' : ' past'}` },
        h('div', { class: 'sheet-top' }, dateBox, ddayBox, totalBox),
        memo,
        h('div', { class: 'sheet-body' }, contents(data, subjectOf, actions), timetable(data, { save: actions.saveTimetable })));
    }

    /** CONTENTS: 그날 할 일을 과목별로 묶고 형광펜처럼 칠한다. 완료는 O */
    function contents(data, subjectOf, actions) {
      const tasks = data.day.taskIds.map((id) => data.tasks.find((t) => t.id === id)).filter(Boolean);
      const groups = new Map();
      for (const t of tasks) groups.set(t.subjectId, [...(groups.get(t.subjectId) ?? []), t]);
      return h('div', { class: 'contents' },
        h('div', { class: 'sheet-label' }, 'CONTENTS'),
        groups.size === 0 && h('p', { class: 'empty' },
          data.editable ? '오른쪽 과목 목록에서 ＋오늘을 눌러 담아요' : '이 날은 담아 둔 할 일이 없어요'),
        [...groups].map(([subjectId, list]) => {
          const subject = subjectOf(subjectId);
          return h('div', { class: 'contents-group', style: `--c:${subject?.color}` },
            h('span', { class: 'hand subject-name' }, subject?.name),
            h('ul', {}, list.map((t) => h('li', { class: t.done ? 'done' : '' },
              h('span', { class: 'hand highlight' }, t.title),
              h('button', { class: 'mark', disabled: !data.editable, title: t.done ? '완료 취소' : '완료',
                onClick: () => actions.toggleDone(t) }, t.done ? 'O' : '')))));
        }));
    }
  planner-view.js: |
    // 플래너: 과목 → 할 일(과목별 백로그) → 그날의 플래너
    // 기본(플래너 페이지): 종이 플래너 시트(planner-sheet.js, 지난 날짜는 읽기 전용) + 과목 관리 카드
    // compact 모드(공부방): 오늘 목록 + 백로그에서 추가
    import { del, get, patch, post, put } from './api.js';
    import { plannerSheet } from './planner-sheet.js';
    import { SUBJECT_COLORS, fill, fmtDate, fmtShort, h, swatches, toast } from './ui.js';

    export function createPlanner(container, { compact = false, onChange } = {}) {
      let data = null;
      let newSubjectColor = SUBJECT_COLORS[0];
      let focusSubject = null;          // 할 일 추가 후 같은 입력창에 다시 포커스
      const openSubjects = new Set();
      const progress = h('div', { class: 'progress' });
      const colorBox = h('div');        // 색만 다시 그려서 입력 중인 과목 이름을 지키기
      const drawColors = () => colorBox.replaceChildren(
        swatches(SUBJECT_COLORS, newSubjectColor, (c) => { newSubjectColor = c; drawColors(); }));

      const subjectOf = (id) => data.subjects.find((s) => s.id === id);
      const taskOf = (id) => data.tasks.find((t) => t.id === id);
      const dayIds = () => data.day.taskIds;

      async function act(request) {
        try {
          apply(await request);
        } catch (err) {
          toast(err.message);
        }
      }

      function apply(next) {
        data = next;
        draw();
        onChange?.(data);
      }

      const load = (date) => act(get(`/planner${date ? `?date=${date}` : ''}`));
      const setToday = (ids) => act(put('/daily', { taskIds: ids }));
      const toggleDone = (t) => act(patch(`/tasks/${t.id}`, { done: !t.done }));
      const sheetActions = {
        load,
        toggleDone,
        saveDaily: (changes) => act(put('/daily', changes)),
        saveTimetable: (cells) => act(put('/timetable', { timetable: cells })),
        saveDday: (title, date) => act(put('/dday', { title, date })),
      };

      // ---------- 오늘의 플래너 (공부방 compact) ----------

      function drawProgress() {
        const goal = data.day.goalMin * 60;
        const studied = data.study.totalSec;
        const ratio = goal ? Math.min(1, studied / goal) : 0;
        const bySubject = Object.entries(data.study.bySubject).filter(([id]) => subjectOf(id));
        fill(progress,
          h('div', { class: 'bar' }, h('span', { style: `width:${ratio * 100}%` })),
          h('small', {}, `${fmtShort(studied)} / 목표 ${fmtShort(goal)}`),
          bySubject.length > 0 && h('div', { class: 'subject-times' }, bySubject.map(([id, sec]) =>
            h('span', { class: 'chip', style: `--c:${subjectOf(id).color}` }, h('i', { class: 'dot' }), `${subjectOf(id).name} ${fmtShort(sec)}`))));
      }

      function daySection() {
        const tasks = dayIds().map(taskOf).filter(Boolean);
        const done = tasks.filter((t) => t.done).length;
        const empty = !data.editable ? '이 날은 담아 둔 할 일이 없어요'
          : compact ? '아래에서 과목의 할 일을 골라 추가해요' : '과목의 할 일에서 ＋오늘을 눌러 오늘 목록을 채워요';
        return h('div', { class: 'today' },
          h('div', { class: 'row between' },
            h('h3', {}, `${data.editable ? '오늘' : '그날'} 할 일 ${done}/${tasks.length}`),
            h('label', { class: 'goal' }, '목표',
              h('input', { type: 'number', min: 0, max: 1440, step: 10, value: data.day.goalMin, disabled: !data.editable,
                onChange: (e) => act(put('/daily', { goalMin: Number(e.target.value) })) }),
              '분')),
          progress,
          tasks.length ? h('ul', { class: 'tasks' }, tasks.map((t) => taskRow(t, { inDay: true }))) : h('p', { class: 'empty' }, empty),
          !data.editable && h('small', {}, '지난 기록은 볼 수만 있어요'));
      }

      function taskRow(t, { inDay }) {
        const subject = subjectOf(t.subjectId);
        const inToday = data.editable && dayIds().includes(t.id);
        const readOnly = inDay && !data.editable;
        return h('li', { class: `task${t.done ? ' done' : ''}` },
          h('input', { type: 'checkbox', checked: t.done, disabled: readOnly, onChange: () => toggleDone(t), 'aria-label': '완료' }),
          inDay && h('i', { class: 'dot', style: `--c:${subject?.color}`, title: subject?.name }),
          h('span', { class: 'title' }, t.title),
          inDay
            ? !readOnly && h('button', { class: 'icon', title: '오늘 목록에서 빼기',
              onClick: () => setToday(dayIds().filter((id) => id !== t.id)) }, '↩')
            // 지난 날짜를 보는 중에는 오늘 목록을 모르므로 ＋오늘을 숨긴다
            : data.editable && !t.done && h('button', { class: `chip-btn${inToday ? ' on' : ''}`, disabled: inToday,
              onClick: () => setToday([...dayIds(), t.id]) }, inToday ? '오늘 ✓' : '＋오늘'),
          !inDay && h('button', { class: 'icon', title: '삭제', onClick: () => act(del(`/tasks/${t.id}`)) }, '✕'));
      }

      // ---------- 과목 관리 (플래너 페이지) ----------

      function subjectsSection() {
        return h('div', { class: 'subjects' },
          h('div', { class: 'planner-head' }, h('h2', {}, '과목과 할 일'), h('small', {}, data.editable ? '＋오늘로 오늘 목록에 담기' : '')),
          !data.subjects.length && h('p', { class: 'empty' }, '먼저 과목을 만들어 보세요 (예: 알고리즘, 영어)'),
          data.subjects.map(subjectBlock),
          h('form', { class: 'add-subject', onSubmit: addSubject },
            h('input', { name: 'name', placeholder: '새 과목 이름', maxLength: 20, required: true }),
            colorBox,
            h('button', { class: 'btn small', type: 'submit' }, '과목 추가')));
      }

      function subjectBlock(s) {
        const tasks = data.tasks.filter((t) => t.subjectId === s.id);
        const open = openSubjects.has(s.id);
        const input = h('input', { name: 'title', placeholder: '할 일 추가', maxLength: 50, required: true });
        if (focusSubject === s.id) queueMicrotask(() => input.focus());
        return h('div', { class: `subject${open ? ' open' : ''}`, style: `--c:${s.color}` },
          h('div', { class: 'subject-head' },
            h('button', { class: 'subject-toggle', onClick: () => toggleOpen(s.id) },
              h('i', { class: 'dot' }), s.name,
              h('small', {}, `${tasks.filter((t) => !t.done).length}개 남음`)),
            h('button', { class: 'icon', title: '과목 삭제', onClick: () => removeSubject(s) }, '🗑')),
          open && h('div', { class: 'subject-body' },
            h('ul', { class: 'tasks' }, tasks.map((t) => taskRow(t, { inDay: false }))),
            h('form', { class: 'row', onSubmit: (e) => addTask(e, s.id) },
              input, h('button', { class: 'btn small', type: 'submit' }, '추가'))));
      }

      function toggleOpen(id) {
        openSubjects.has(id) ? openSubjects.delete(id) : openSubjects.add(id);
        draw();
      }

      function addSubject(e) {
        e.preventDefault();
        const name = new FormData(e.target).get('name');
        act(post('/subjects', { name, color: newSubjectColor }).then((d) => {
          openSubjects.add(d.subjects.at(-1).id);
          return d;
        }));
      }

      function addTask(e, subjectId) {
        e.preventDefault();
        focusSubject = subjectId;
        act(post('/tasks', { subjectId, title: new FormData(e.target).get('title') }));
      }

      function removeSubject(s) {
        if (confirm(`'${s.name}' 과목과 할 일을 모두 삭제할까요?`)) act(del(`/subjects/${s.id}`));
      }

      // ---------- 백로그에서 추가 (compact) ----------

      function backlogPicker() {
        const select = h('select', { 'aria-label': '추가할 할 일' },
          h('option', { value: '' }, '과목의 할 일 고르기'),
          data.subjects.map((s) => {
            const left = data.tasks.filter((t) => t.subjectId === s.id && !t.done && !dayIds().includes(t.id));
            return left.length && h('optgroup', { label: s.name },
              left.map((t) => h('option', { value: t.id }, t.title)));
          }));
        return h('div', { class: 'row backlog' }, select,
          h('button', { class: 'btn small', onClick: () => select.value && setToday([...dayIds(), select.value]) }, '추가'));
      }

      function draw() {
        if (compact) {
          container.replaceChildren(
            h('div', { class: 'planner-head' }, h('h2', {}, '오늘의 플래너'), h('small', {}, fmtDate(data.day.date))),
            daySection(), backlogPicker());
        } else {
          container.replaceChildren(h('div', { class: 'planner-grid' },
            plannerSheet(data, sheetActions),
            h('section', { class: 'card planner' }, subjectsSection())));
        }
        drawProgress();
        drawColors();
        focusSubject = null;
      }

      return {
        /** date(YYYYMMDD)를 주면 그날 기록, 없으면 오늘 */
        load,
        get data() { return data; },
        /** 공부방 하트비트로 받은 오늘 공부시간을 진행 막대에만 반영 */
        setStudy(study) {
          if (!data) return;
          data.study = study;
          drawProgress();
        },
      };
    }
  planner.css: |
    /* 플래너 페이지: 최근 7일 · 종이 플래너 시트(TODAY'S · D-DAY · TOTAL TIME · 한마디 · CONTENTS · TIMETABLE) */

    /* ---------- 최근 7일 ---------- */
    .week { display: flex; align-items: center; gap: 16px; padding: 12px 18px; }
    .week-bars { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .week-day {
      display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px;
      border: 2px solid transparent; border-radius: 12px; background: none; cursor: pointer; font: inherit;
    }
    .week-day:hover { background: #f8f0e2; }
    .week-day.on { border-color: var(--leaf); background: #eef7e8; }
    .week-day strong { font-size: 0.8rem; }
    .week-bar { width: 22px; height: 46px; border-radius: 6px; background: #f1e6d2; display: flex; align-items: flex-end; overflow: hidden; }
    .week-bar i { width: 100%; background: linear-gradient(180deg, #a7d38e, var(--leaf)); border-radius: 6px; min-height: 2px; }

    /* ---------- 시트 ---------- */
    .sheet {
      --grid: rgba(120, 100, 70, 0.08);
      display: flex; flex-direction: column; gap: 14px;
      background-color: #fffefa;
      background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 18px 18px;
    }
    .sheet.past { --grid: rgba(120, 100, 70, 0.05); background-color: #faf7f1; }
    .sheet-label { font: 0.72rem var(--font-title); letter-spacing: 2px; color: #8f87b8; }
    .hand { font-family: var(--font-hand); }
    .hand.big { font-size: 1.9rem; line-height: 1.1; color: #5b5aa6; }

    .sheet-top { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 10px; }
    .sheet-box {
      display: flex; flex-direction: column; gap: 4px; padding: 10px 12px;
      border: 2px solid var(--line); border-radius: 14px; background: rgba(255, 255, 255, 0.85);
    }
    .sheet-date .date-nav { display: flex; align-items: center; gap: 6px; }
    .sheet-date .chip-btn { align-self: flex-start; }
    .sheet-dday summary { list-style: none; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
    .sheet-dday summary::-webkit-details-marker { display: none; }
    .sheet-dday[open] form { margin-top: 8px; }
    .sheet-total .goal input { width: 64px; }

    .sheet-memo {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border: 2px dashed var(--line); border-radius: 14px; background: rgba(255, 255, 255, 0.8);
    }
    .sheet-memo .sheet-label { white-space: nowrap; }
    .sheet-memo input { border: 0; background: transparent; font-size: 1.25rem; padding: 2px 4px; }
    .sheet-memo input:focus { background: #fff; }

    .sheet-body { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 16px; align-items: start; }

    /* ---------- CONTENTS ---------- */
    .contents { display: flex; flex-direction: column; gap: 10px; }
    .contents-group { display: grid; grid-template-columns: 70px 1fr; gap: 8px; align-items: start; }
    .contents-group .subject-name { font-size: 1.15rem; color: var(--c); filter: brightness(0.75); padding-top: 4px; overflow-wrap: anywhere; }
    .contents-group ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .contents-group li { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #eee5d6; padding-bottom: 4px; }
    .highlight {
      flex: 1; font-size: 1.15rem; padding: 0 4px; overflow-wrap: anywhere;
      /* 형광펜: 글자 아래쪽 60%만 과목 색으로 칠한다 */
      background: linear-gradient(transparent 40%, color-mix(in srgb, var(--c) 45%, transparent) 40%);
    }
    .contents-group li.done .highlight { color: var(--muted); }
    .mark {
      width: 28px; height: 28px; flex: none; border: 2px solid #c9bfd9; border-radius: 6px; background: #fff;
      font: 700 1.2rem var(--font-hand); color: #5b5aa6; cursor: pointer;
    }
    .mark:disabled { cursor: default; }
    .contents-group li.done .mark { border-color: #5b5aa6; }

    /* ---------- TIMETABLE ---------- */
    .timetable { display: flex; flex-direction: column; gap: 6px; }
    .tt-palette { display: flex; flex-wrap: wrap; gap: 4px; }
    .tt-brush {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px;
      border: 2px solid var(--line); border-radius: 999px; background: #fff; font-size: 0.78rem; cursor: pointer;
    }
    .tt-brush .dot { background: var(--c); border: 1px solid #d8cdbb; }
    .tt-brush.on { border-color: var(--ink); }
    .tt-grid { display: flex; flex-direction: column; border: 2px solid #c9bfd9; border-radius: 8px; overflow: hidden; background: #fff; user-select: none; }
    .tt-grid.editable { touch-action: none; cursor: crosshair; }
    .tt-row { display: grid; grid-template-columns: 26px repeat(6, 1fr); height: 20px; border-top: 1px solid #e6e0f0; }
    .tt-row:first-child { border-top: 0; }
    .tt-hour { font: 0.72rem var(--font-title); color: #8f87b8; display: grid; place-items: center; border-right: 1px solid #c9bfd9; }
    .tt-cell { position: relative; border-left: 1px dotted #e6e0f0; }
    .tt-cell.planned { background: color-mix(in srgb, var(--c) 55%, white); }
    .tt-cell.now { outline: 2px solid #e76f51; outline-offset: -2px; z-index: 1; }
    .tt-actual, .tt-legend .tt-actual { display: block; position: absolute; left: 1px; right: 1px; bottom: 2px; height: 5px; border-radius: 3px; background: #5b5aa6; }
    .tt-legend { display: flex; align-items: center; gap: 6px; }
    .tt-legend .tt-actual { position: static; width: 18px; }

    @media (max-width: 960px) {
      .sheet-body { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .sheet-top { grid-template-columns: 1fr 1fr; }
      .sheet-date { grid-column: 1 / -1; }
      .week { flex-direction: column; align-items: stretch; }
      .week-bar { width: 16px; }
    }
  room-hud.js: |
    // 공부방 화면의 HUD(상단 바·참가자·하단 도크). 상태는 room-view.js가 갖고, 여기서는 그리기만 한다.
    import { STATUS, characterOf, fmtClock, fmtShort, h } from './ui.js';

    export function createHud(on) {
      const roomName = h('strong', {});
      const codeBox = h('span', {});
      const daylightChip = h('span', { class: 'badge daylight' });
      const members = h('ul', { class: 'members' });
      const timer = h('div', { class: 'timer' }, '00:00:00');
      const statusPill = h('span', { class: 'status-pill' });
      const subjectSelect = h('select', { 'aria-label': '지금 공부하는 과목', onChange: (e) => on.subject(e.target.value || null) });
      const controls = h('div', { class: 'controls' });
      const cameraBox = h('div', { class: 'camera' });
      const musicBtn = h('button', { class: 'btn ghost small', onClick: on.music }, '🎵 lo-fi 켜기');
      const plannerBox = h('div', { class: 'planner compact' });
      const plannerPanel = h('aside', { class: 'panel left card' }, plannerBox);

      const el = h('div', { class: 'room-screen' },
        h('div', { class: 'stage' }),
        h('header', { class: 'room-top' },
          h('button', { class: 'btn ghost small', onClick: on.leave }, '← 공부방 목록'),
          h('div', { class: 'room-title' }, roomName, codeBox, daylightChip),
          h('div', { class: 'row' },
            h('button', { class: 'btn ghost small', onClick: () => plannerPanel.classList.toggle('hidden') }, '📒 플래너'),
            musicBtn,
            h('input', { type: 'range', min: 0, max: 1, step: 0.05, value: 0.6, 'aria-label': '음량',
              onInput: (e) => on.volume(Number(e.target.value)) }))),
        plannerPanel,
        h('aside', { class: 'panel right card' }, h('h3', {}, '함께 공부 중'), members),
        h('div', { class: 'session' }, h('div', { class: 'session-label' }, '오늘의 공부 ', statusPill), timer),
        h('footer', { class: 'dock card' },
          h('label', { class: 'dock-subject' }, h('small', {}, '지금 공부하는 과목'), subjectSelect),
          controls,
          cameraBox));

      return {
        el,
        stage: el.querySelector('.stage'),
        plannerBox,

        setRoom(room) {
          roomName.textContent = room.name;
          codeBox.replaceChildren(room.code
            ? h('button', { class: 'badge private', title: '코드 복사', onClick: () => on.copyCode(room.code) }, `🔒 ${room.code}`)
            : h('span', { class: 'badge' }, '공개방'));
        },

        renderMembers(list, myId) {
          const sorted = [...list].sort((a, b) => (a.seat ?? 99) - (b.seat ?? 99));
          members.replaceChildren(...sorted.map((m) => h('li', { class: m.id === myId ? 'me' : '' },
            h('span', { class: 'avatar', style: `--c:${characterOf(m.character).color}` }, characterOf(m.character).emoji),
            h('div', {}, h('strong', {}, m.name, m.id === myId && ' (나)'),
              h('small', {}, m.seat == null ? '자리 고르는 중' : `${STATUS[m.status].label} · 오늘 ${fmtShort(m.todaySec)}`)),
            h('span', { class: `dot-status ${m.status}` }))));
        },

        renderControls(state, status) {
          statusPill.className = `status-pill ${status}`;
          statusPill.textContent = state.seat == null ? '빈 자리를 클릭해 앉으세요' : `${STATUS[status].emoji} ${STATUS[status].label}`;
          const btn = (label, onClick, cls = '') => h('button', { class: `btn ${cls}`, onClick, disabled: state.seat == null }, label);
          const seg = (mode, label) => h('button', { class: `seg${state.mode === mode ? ' on' : ''}`, onClick: () => on.mode(mode) }, label);
          controls.replaceChildren(
            state.running
              ? h('div', { class: 'row' },
                btn(state.onBreak ? '▶ 다시 공부' : '☕ 휴식', on.toggleBreak),
                btn('■ 그만하기', on.stop, 'ghost'))
              : btn('▶ 공부 시작', on.start, 'primary'),
            h('div', { class: 'row mode' }, seg('manual', '✋ 수동'), seg('camera', '📷 자리 감지')));
        },

        /** 창밖 시간대 표시: "🌇 노을 18:30" */
        setDaylight(d) {
          const hh = String(Math.floor(d.hours)).padStart(2, '0');
          const mm = String(Math.floor((d.hours % 1) * 60)).padStart(2, '0');
          daylightChip.textContent = `${d.name} ${hh}:${mm}`;
        },

        renderTimer(sec) {
          timer.textContent = fmtClock(Math.floor(sec));
        },

        setSubjects(subjects, selected) {
          subjectSelect.replaceChildren(h('option', { value: '' }, '시간표 계획대로'),
            ...subjects.map((s) => h('option', { value: s.id, selected: s.id === selected }, s.name)));
        },

        setCamera(video, message) {
          cameraBox.replaceChildren(...(video ? [video, h('i', { class: 'led' })] : message ? [h('small', {}, message)] : []));
        },

        setDetected(detected) {
          cameraBox.classList.toggle('detected', detected);
        },

        setMusic(playing) {
          musicBtn.textContent = playing ? '🎵 lo-fi 끄기' : '🎵 lo-fi 켜기';
        },
      };
    }
  room-model.js: |
    // 도서관 디오라마: 통유리 창(창밖은 실제 시각의 하늘) · 양쪽 원목 책장 · 창가 라운지
    // + 가운데 책상 섬(좌석, 책상마다 스탠드) 배치
    import * as THREE from 'three';
    import { DESK, bankerLamp, deskSet, laptop } from './furniture.js';
    import { armchair, libraryShelf, plant, sideTable, wallSconce, windowWall } from './library-decor.js';
    import { box, group } from './mesh.js';
    import { createSkyView, woodFloor } from './textures.js';

    export const ROOM = { width: 14, depth: 10, wallHeight: 5.2 };
    const W = ROOM.width / 2;
    const D = ROOM.depth / 2;
    const EXTEND = 7;                         // 카메라(+x) 쪽으로 바닥·벽·책장을 늘려 방 밖 빈 공간이 안 보이게
    const DESK_SPACING = DESK.width + 0.05;   // 책상을 옆으로 붙인다
    const ISLAND_Z = -0.5;                    // 책상 섬의 중심
    const LAMP_SHADES = ['#6f9a5c', '#e8a33d'];
    const BACK_SHELF_HEIGHT = 3.0;            // 그 위에 단 벽 조명이 화면 안에 들어오는 높이

    function place(object, [x, y, z], rotY = 0) {
      object.position.set(x, y, z);
      object.rotation.y = rotY;
      return object;
    }

    function floor() {
      const length = ROOM.width + EXTEND;
      const map = woodFloor().clone();
      map.repeat.set(length / 3.5, 3);
      map.needsUpdate = true;
      const top = new THREE.Mesh(new THREE.PlaneGeometry(length, ROOM.depth), new THREE.MeshStandardMaterial({ map, roughness: 0.6 }));
      top.rotation.x = -Math.PI / 2;
      top.position.x = EXTEND / 2;
      top.receiveShadow = true;
      return top;
    }

    /**
     * 창밖 풍경판: 조명 영향을 받지 않는 재질로 하늘 그림을 그대로 보여 준다.
     * 카메라가 위에서 내려다보므로 지평선(그림의 62% 높이)이 바닥 높이 근처(y≈-0.3)에 오게 낮춰 둔다.
     */
    function skyBackdrop(sky) {
      const height = 26;
      const horizonY = -0.3;
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(60, height),
        new THREE.MeshBasicMaterial({ map: sky.texture, fog: false, toneMapped: false }));
      return place(plane, [-W - 4, horizonY - height / 2 + height * 0.62, 0], Math.PI / 2);
    }

    function library() {
      const h = ROOM.wallHeight;
      const wallLength = ROOM.width + EXTEND;
      const shelfLength = wallLength - 1.4;
      const shelfX = 0.7 + EXTEND / 2;
      return group(
        place(windowWall(ROOM.depth, h), [-W, 0, 0], Math.PI / 2),
        box(wallLength, h, 0.3, '#ece8e1', [EXTEND / 2, h / 2, -D - 0.15]),          // 뒷벽
        box(wallLength, h, 0.3, '#ece8e1', [EXTEND / 2, h / 2, D + 0.15]),           // 앞벽
        place(libraryShelf(shelfLength, BACK_SHELF_HEIGHT), [shelfX, 0, -D + 0.25]),
        place(libraryShelf(shelfLength, 2.2), [shelfX, 0, D - 0.25], Math.PI),
        place(armchair(), [-W + 1.3, 0, -3.4], -Math.PI / 2),                          // 창을 바라보는 라운지
        place(sideTable(), [-W + 1.3, 0, -2.6]),
        place(armchair(), [-W + 1.3, 0, 2.7], -Math.PI / 2),
        // 창가 화분: 가운데 기둥 양옆과 양 끝 구석
        ...[[-D + 0.7, 1.2], [-1.1, 0.9], [1.0, 1.3], [2.0, 0.7], [D - 0.8, 1.1], [-1.9, 0.6]]
          .map(([z, scale]) => place(plant(scale), [-W + 0.55, 0, z])),
      );
    }

    /**
     * 양쪽 책장 위 벽에 일정 간격으로 붙이는 벽 조명. 점광원은 잘 보이는 뒷벽 쪽에만 둔다.
     * 앞벽은 카메라와 가까워 화면 가장자리에서 크게 잘려 보이므로 창 쪽(먼 구간)에만 둔다.
     */
    function wallLights() {
      const first = -W + 2.4;
      const last = W + 1;
      const count = Math.round((last - first) / 3.2) + 1;
      const xs = Array.from({ length: count }, (_, i) => first + (i * (last - first)) / (count - 1));
      const back = xs.map((x) => {
        const s = wallSconce();
        place(s.object, [x, BACK_SHELF_HEIGHT + 0.4, -D]);
        return s;
      });
      const front = xs.filter((x) => x < 0).map((x) => {
        const s = wallSconce({ withLight: false });
        place(s.object, [x, 3.1, D], Math.PI);
        return s;
      });
      return [...back, ...front];
    }

    /**
     * 책상 앞면끼리 맞붙인 "책상 섬" 배치. 두 줄이 서로 마주 본다.
     * 앞쪽 인덱스 줄은 +z를 보고, 나머지 줄은 180° 돌아 -z를 본다.
     */
    export function seatLayout(count) {
      const cols = count / 2;
      return Array.from({ length: count }, (_, i) => {
        const facingPlusZ = i < cols;
        return {
          x: (i % cols - (cols - 1) / 2) * DESK_SPACING + 0.6,
          z: ISLAND_Z + (facingPlusZ ? -DESK.far : DESK.far),
          rotY: facingPlusZ ? 0 : Math.PI,
        };
      });
    }

    /** 빈 자리 표시(바닥의 고리) */
    function seatMarker() {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.38, 0.5, 32),
        new THREE.MeshBasicMaterial({ color: '#ffcf8a', transparent: true, opacity: 0.7 }));
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.02;
      return ring;
    }

    function seat({ x, z, rotY }, index, hitMaterial) {
      const anchor = place(new THREE.Group(), [x, 0, z], rotY);
      const screen = laptop();
      screen.object.position.set(0.05, DESK.top, DESK.near + 0.35);
      // 클릭 판정 상자: 의자 뒤(-0.45) ~ 책상 앞 가장자리 직전까지 (마주 보는 좌석과 겹치지 않게)
      const hitDepth = DESK.far - 0.05 + 0.45;
      const hitbox = new THREE.Mesh(new THREE.BoxGeometry(DESK.width - 0.05, 1.6, hitDepth), hitMaterial);
      hitbox.position.set(0, 0.8, -0.45 + hitDepth / 2);
      hitbox.userData.seat = index;
      const lamp = bankerLamp(LAMP_SHADES[index % LAMP_SHADES.length]);
      lamp.object.position.set(-DESK.width / 2 + 0.35, DESK.top, DESK.far - 0.3);
      const marker = seatMarker();
      anchor.add(deskSet(), screen.object, lamp.object, marker, hitbox);
      return { index, anchor, marker, hitbox, laptop: screen, lamp };
    }

    export function buildRoom(scene, seatCount) {
      const sky = createSkyView();
      const sconces = wallLights();
      scene.add(floor(), skyBackdrop(sky), library(), ...sconces.map((s) => s.object));

      const hitMaterial = new THREE.MeshBasicMaterial({ visible: false });
      const seats = seatLayout(seatCount).map((s, i) => seat(s, i, hitMaterial));
      seats.forEach((s) => scene.add(s.anchor));
      // lamps: 시간대에 따라 밝기가 바뀌는 조명 (책상 스탠드 + 벽 조명)
      return { seats, lamps: [...seats.map((s) => s.lamp), ...sconces], sky };
    }
  room-view.js: |
    // 공부방: 내 공부 상태를 정하고 3초마다 하트비트로 서버와 동기화한다.
    //
    // 상태 결정 규칙
    //   자리 없음 / 시작 안 함 → IDLE,  휴식 → BREAK,
    //   자리 감지 모드에서 얼굴이 안 보임 → AWAY,  그 외 → STUDYING
    import { post } from './api.js';
    import { createLofi } from './lofi.js';
    import { createPlanner } from './planner-view.js';
    import { createHud } from './room-hud.js';
    import { createScene } from './scene.js';
    import { toast } from './ui.js';
    import { startPresence } from './vision.js';

    const HEARTBEAT_MS = 3000;
    const KICK_OUT = [401, 403, 404, 409];

    export function mountRoom(root, ctx, roomId) {
      const state = { seat: null, running: false, onBreak: false, mode: 'manual', present: true, subjectId: null };
      let me = { totalSec: 0 };
      let syncedAt = 0;
      let scene = null;
      let vision = null;
      let inflight = false;
      let pending = false;
      let closed = false;
      const lofi = createLofi();

      const status = () => {
        if (state.seat == null || !state.running) return 'IDLE';
        if (state.onBreak) return 'BREAK';
        if (state.mode === 'camera' && !state.present) return 'AWAY';
        return 'STUDYING';
      };

      const hud = createHud({
        leave: () => ctx.go('#/rooms'),
        start: () => change({ running: true, onBreak: false }),
        stop: () => change({ running: false, onBreak: false }),
        toggleBreak: () => change({ onBreak: !state.onBreak }),
        subject: (id) => change({ subjectId: id }),
        mode: setMode,
        music: async () => {
          lofi.playing ? lofi.pause() : await lofi.play();
          hud.setMusic(lofi.playing);
        },
        volume: (v) => lofi.setVolume(v),
        copyCode: (code) => navigator.clipboard?.writeText(code).then(() => toast(`방 코드 ${code} 복사됨`)),
      });
      root.append(hud.el);

      const planner = createPlanner(hud.plannerBox, {
        compact: true,
        onChange: (d) => {
          if (!d.subjects.some((s) => s.id === state.subjectId)) state.subjectId = null;
          hud.setSubjects(d.subjects, state.subjectId);
          beat();   // 책상 위 책 더미(남은 할 일) 갱신
        },
      });
      planner.load();

      function change(patch) {
        Object.assign(state, patch);
        hud.renderControls(state, status());
        beat();
      }

      async function setMode(mode) {
        if (mode === state.mode) return;
        if (mode === 'camera') {
          hud.setCamera(null, '카메라와 감지 모델을 불러오는 중…');
          try {
            vision = await startPresence({
              onChange: (present) => change({ present }),
              onSample: (detected) => hud.setDetected(detected),
            });
            if (closed) return vision.stop();
            hud.setCamera(vision.video);
          } catch (err) {
            console.warn(err);
            hud.setCamera(null);
            toast('카메라를 사용할 수 없어 수동 모드로 계속해요');
            return;
          }
        } else {
          vision?.stop();
          vision = null;
          hud.setCamera(null);
        }
        change({ mode, present: true });
      }

      // ---------- 서버 동기화 ----------

      async function beat() {
        if (closed) return;
        if (inflight) {
          pending = true;
          return;
        }
        inflight = true;
        try {
          const subject = planner.data?.subjects.find((s) => s.id === state.subjectId);
          const res = await post(`/rooms/${roomId}/heartbeat`, {
            seat: state.seat, status: status(), subjectId: state.subjectId, subjectColor: subject?.color,
          });
          if (closed) return;
          if (res.seatTaken) {
            state.seat = null;
            toast('이미 누가 앉은 자리예요');
          }
          me = res.me;
          syncedAt = performance.now();
          scene ??= createScene(hud.stage, {
            seatCount: res.room.max,
            onSeatClick: (seat) => change({ seat }),
            onDaylight: (d) => hud.setDaylight(d),
          });
          scene.update(res.members, ctx.user.id, true);
          hud.setRoom(res.room);
          hud.renderMembers(res.members, ctx.user.id);
          hud.renderControls(state, status());
          planner.setStudy(res.me);
        } catch (err) {
          if (KICK_OUT.includes(err.status)) {
            toast(err.message);
            ctx.go('#/rooms');
          }
        } finally {
          inflight = false;
          if (pending) {
            pending = false;
            beat();
          }
        }
      }

      function renderTimer() {
        const sinceSync = status() === 'STUDYING' && syncedAt ? (performance.now() - syncedAt) / 1000 : 0;
        hud.renderTimer(me.totalSec + sinceSync);
      }

      const leaveBeacon = () => navigator.sendBeacon(`/api/rooms/${roomId}/leave`);
      addEventListener('pagehide', leaveBeacon);
      hud.renderControls(state, status());
      beat();
      const timers = [setInterval(beat, HEARTBEAT_MS), setInterval(renderTimer, 1000)];

      return () => {
        closed = true;
        timers.forEach(clearInterval);
        removeEventListener('pagehide', leaveBeacon);
        post(`/rooms/${roomId}/leave`).catch(() => {});
        vision?.stop();
        lofi.close();
        scene?.destroy();
      };
    }
  room.css: |
    /* 공부방: 밤 공부방 테마 (어두운 유리 패널 + 따뜻한 크림색 글자) */
    .room-screen {
      --glass: rgba(24, 17, 13, 0.72);
      --glass-line: rgba(255, 220, 170, 0.14);
      --cream: #f6e7cf;
      --cream-dim: #bda98e;
      --amber: #f0a64a;
      position: fixed; inset: 0; overflow: hidden;
      background: #120d0a;
      color: var(--cream);
    }
    .room-screen small { color: var(--cream-dim); }
    .room-screen .card {
      background: var(--glass);
      border: 1px solid var(--glass-line);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }
    .room-screen .btn { background: rgba(255, 230, 190, 0.12); color: var(--cream); box-shadow: none; border: 1px solid var(--glass-line); }
    .room-screen .btn.primary { background: var(--amber); color: #2a1a0e; border-color: var(--amber); }
    .room-screen .btn.ghost { background: transparent; }
    .room-screen .seg { background: transparent; border: 1px solid var(--glass-line); color: var(--cream); }
    .room-screen .seg.on { background: var(--amber); border-color: var(--amber); color: #2a1a0e; }
    .room-screen input, .room-screen select { background: rgba(255, 240, 220, 0.08); border: 1px solid var(--glass-line); color: var(--cream); }
    .room-screen option, .room-screen optgroup { color: #2a1a0e; }
    .room-screen .badge, .room-screen .chip { background: rgba(255, 230, 190, 0.14); color: var(--cream); }
    .room-screen .badge.private { background: rgba(240, 166, 74, 0.25); }

    .stage { position: absolute; inset: 0; }
    .stage canvas { display: block; }
    .label-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .name-tag {
      position: absolute; left: 0; top: 0; white-space: nowrap;
      padding: 2px 10px; border-radius: 999px;
      background: rgba(20, 14, 10, 0.72); border: 1px solid var(--glass-line);
      font: 12px var(--font-title); color: var(--cream);
    }
    .name-tag.me { border: 2px solid var(--amber); }
    .name-tag { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
    .name-tag .plan {
      display: flex; align-items: center; gap: 4px; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
      font: 11px var(--font-body); color: var(--cream);
    }
    .name-tag .plan .dot { width: 7px; height: 7px; }
    .name-tag.AWAY { color: #ffb4a0; }

    .room-top {
      position: absolute; top: 12px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      pointer-events: none;
    }
    .room-top > * { pointer-events: auto; }
    .room-title { display: flex; align-items: center; gap: 10px; font-family: var(--font-title); font-size: 1.3rem; text-shadow: 0 2px 8px #000; }

    .panel { position: absolute; top: 64px; width: 290px; max-height: calc(100% - 300px); overflow: auto; padding: 14px; }
    .panel.left { left: 16px; }
    .panel.right { right: 16px; }
    .panel.hidden { display: none; }
    .room-screen .task { background: rgba(255, 240, 220, 0.06); }
    .room-screen .progress .bar { background: rgba(255, 240, 220, 0.12); }
    .room-screen .subject-times { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .room-screen .subject-times .chip { font: 0.75rem var(--font-body); padding: 2px 8px; }
    .room-screen .progress .bar span { background: linear-gradient(90deg, #d9883a, var(--amber)); }

    .members { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .members li { display: flex; align-items: center; gap: 10px; }
    .members li.me strong { color: var(--amber); }
    .members li div { flex: 1; display: flex; flex-direction: column; }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--c); display: grid; place-items: center; font-size: 1.2rem; }
    .dot-status { width: 10px; height: 10px; border-radius: 50%; background: #6d6157; }
    .dot-status.STUDYING { background: #8fd16a; box-shadow: 0 0 8px #8fd16a; }
    .dot-status.AWAY { background: #ff7b5c; }
    .dot-status.BREAK { background: #f0c75e; }

    /* 왼쪽 아래 큰 타이머 */
    .session { position: absolute; left: 28px; bottom: 22px; pointer-events: none; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7); }
    .session-label { display: flex; align-items: center; gap: 8px; font-size: 1.05rem; letter-spacing: 2px; opacity: 0.9; }
    .timer { font-family: var(--font-title); font-size: 4.2rem; line-height: 1; letter-spacing: 2px; font-variant-numeric: tabular-nums; color: #fff8ec; }
    .status-pill { font-family: var(--font-title); font-size: 0.8rem; letter-spacing: 0; padding: 2px 10px; border-radius: 999px; background: rgba(255, 240, 220, 0.14); }
    .status-pill.STUDYING { background: rgba(143, 209, 106, 0.25); color: #c9f0ad; }
    .status-pill.AWAY { background: rgba(255, 123, 92, 0.25); color: #ffc2b0; }
    .status-pill.BREAK { background: rgba(240, 199, 94, 0.25); color: #ffe39a; }

    .dock {
      position: absolute; right: 16px; bottom: 16px;
      display: flex; align-items: center; gap: 16px; padding: 12px 16px; max-width: calc(100% - 380px);
      flex-wrap: wrap; justify-content: flex-end;
    }
    .dock-subject { display: flex; flex-direction: column; gap: 2px; min-width: 150px; }
    .controls { display: flex; flex-direction: column; gap: 6px; align-items: center; }
    .controls .mode .seg { padding: 3px 10px; font-size: 0.85rem; }
    .camera { position: relative; display: flex; align-items: center; }
    .camera video { width: 112px; height: 84px; object-fit: cover; border-radius: 12px; transform: scaleX(-1); border: 2px solid var(--glass-line); }
    .camera .led { position: absolute; top: 6px; right: 6px; width: 12px; height: 12px; border-radius: 50%; background: #6d6157; border: 2px solid #fff; }
    .camera.detected .led { background: #4caf50; }
    .camera.detected video { border-color: #8fd16a; }

    @media (max-width: 860px) {
      .room-screen { overflow: auto; display: flex; flex-direction: column; }
      .room-screen > * { flex: none; }
      .room-top { order: -1; position: static; padding: 12px 16px 0; }
      .stage { position: relative; height: 46vh; }
      .session { position: absolute; top: calc(46vh + 20px); left: 24px; bottom: auto; }
      .timer { font-size: 2.6rem; }
      .name-tag { font-size: 10px; padding: 1px 7px; }
      .panel { position: static; width: auto; max-height: none; margin: 8px 16px; }
      .dock { position: static; margin: 8px 16px 16px; max-width: none; justify-content: center; }
    }
  rooms-view.js: |
    // 공부방 페이지: 방 목록 · 방 만들기(모달) · 비공개방 코드 입장
    import { get, post } from './api.js';
    import { mountShell } from './shell.js';
    import { h, toast } from './ui.js';

    const REFRESH_MS = 5000;

    export function mountRooms(root, ctx) {
      const shell = mountShell(root, ctx, 'rooms');
      const grid = h('div', { class: 'room-grid' });
      const dialog = createRoomDialog(ctx);
      const count = h('span', { class: 'room-count' }, '불러오는 중');
      const live = h('span', { class: 'live-note', role: 'status' }, '공부방을 확인하고 있어요');
      let closed = false;
      let lastRooms = null;
      const date = new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', weekday: 'long',
      }).format(new Date());

      shell.main.append(
        h('div', { class: 'page-head' },
          h('div', {}, h('span', { class: 'eyebrow' }, date), h('h1', {}, '공부방'),
            h('p', {}, '마음에 드는 방에 자리를 잡고, 오늘의 공부를 시작하세요.')),
          h('button', { class: 'btn primary', onClick: () => dialog.open() }, '＋ 방 만들기')),
        h('div', { class: 'rooms-toolbar' },
          h('div', { class: 'rooms-heading' }, h('h2', {}, '열린 공부방'), count),
          h('div', { class: 'page-actions' },
            h('form', { class: 'code-join', onSubmit: joinByCode },
              h('label', { htmlFor: 'room-code' }, '초대받으셨나요?'),
              h('input', { id: 'room-code', name: 'code', class: 'code-input', placeholder: '6자리 코드', maxLength: 6,
                minLength: 6, pattern: '[A-Z0-9]{6}', required: true,
                autocomplete: 'off', 'aria-label': '비공개방 코드', onInput: (e) => { e.target.value = e.target.value.toUpperCase(); } }),
              h('button', { class: 'btn', type: 'submit' }, '코드로 입장')))),
        grid,
        h('div', { class: 'rooms-note' }, live, h('span', {}, '공개방은 누구나 · 비공개방은 초대 코드로')),
        dialog.element);

      async function loadRooms() {
        try {
          const { rooms } = await get('/rooms');
          if (closed) return;
          count.textContent = String(rooms.length);
          live.textContent = '실시간으로 업데이트 중';
          live.classList.remove('offline');
          // 내용이 같으면 버튼을 다시 만들지 않아 키보드 포커스를 유지한다.
          const signature = JSON.stringify(rooms);
          if (signature !== lastRooms) {
            grid.replaceChildren(...(rooms.length ? rooms.map(roomCard) : [emptyState()]));
            lastRooms = signature;
          }
        } catch (err) {
          if (closed) return;
          if (err.status === 401) ctx.logout();
          live.textContent = '연결을 확인해 주세요 · 5초 후 다시 시도해요';
          live.classList.add('offline');
          if (!grid.childElementCount) {
            count.textContent = '—';
            grid.replaceChildren(h('div', { class: 'empty-state' },
              h('h3', {}, '공부방을 불러오지 못했어요'),
              h('p', {}, '잠시 후 다시 시도하거나 연결 상태를 확인해 주세요.'),
              h('button', { class: 'btn', onClick: loadRooms }, '다시 불러오기')));
          }
        }
      }

      const roomCard = (r, index) => h('article', { class: `card room-card${r.count >= r.max ? ' full' : ''}` },
        h('div', { class: 'room-card-top' },
          h('span', { class: 'room-number', 'aria-hidden': 'true' }, String(index + 1).padStart(2, '0')),
          h('span', { class: `badge${r.private ? ' private' : ''}` }, r.private ? '비공개' : '공개방')),
        h('h3', {}, r.name),
        h('div', { class: 'room-occupancy' },
          h('div', { class: 'seats', 'aria-label': `${r.max}자리 중 ${r.count}명 참여 중` },
            Array.from({ length: r.max }, (_, i) => h('i', { class: i < r.count ? 'filled' : '', 'aria-hidden': 'true' }))),
          h('span', { class: 'seat-count' }, h('strong', {}, String(r.count)), ` / ${r.max}`)),
        h('div', { class: 'room-card-foot' },
          h('small', {}, r.count >= r.max ? '모든 자리가 찼어요' : r.count ? `${r.max - r.count}자리 남아 있어요` : '첫 번째로 자리를 잡아보세요'),
          h('button', { class: 'btn small', disabled: r.count >= r.max, 'aria-label': `${r.name} 입장`,
            onClick: () => ctx.go(`#/room/${r.id}`) }, r.count >= r.max ? '입장 마감' : '입장하기 ↗')));

      const emptyState = () => h('div', { class: 'card empty-state' },
        h('span', { class: 'empty-book', 'aria-hidden': 'true' }),
        h('h3', {}, '아직 열린 방이 없어요'),
        h('p', {}, '첫 방을 만들고 친구를 초대해 보세요.'),
        h('button', { class: 'btn primary', onClick: () => dialog.open() }, '＋ 방 만들기'));

      async function joinByCode(e) {
        e.preventDefault();
        const button = e.target.querySelector('[type="submit"]');
        button.disabled = true;
        try {
          const { roomId } = await post('/rooms/join-code', { code: new FormData(e.target).get('code') });
          ctx.go(`#/room/${roomId}`);
        } catch (err) {
          toast(err.message);
        } finally {
          button.disabled = false;
        }
      }

      loadRooms();
      const timer = setInterval(loadRooms, REFRESH_MS);
      return () => {
        closed = true;
        clearInterval(timer);
        shell.destroy();
      };
    }

    /** 방 만들기 모달 (<dialog> — Esc로 닫힘) */
    function createRoomDialog(ctx) {
      const options = { max: 6, private: false };
      const element = h('dialog', { class: 'card room-dialog', 'aria-labelledby': 'room-dialog-title' });

      function draw() {
        const seg = (label, on, onClick) => h('button', {
          type: 'button', class: `seg${on ? ' on' : ''}`, 'aria-pressed': String(on), onClick,
        }, label);
        const name = element.querySelector('input')?.value ?? '';
        element.replaceChildren(h('form', { class: 'stack', onSubmit: create },
          h('h2', { id: 'room-dialog-title' }, '새 공부방'),
          h('p', { class: 'dialog-description' }, '방 이름과 자리를 정하고 공부를 시작하세요.'),
          h('label', { class: 'field' }, h('span', {}, '방 이름'),
            h('input', { name: 'name', placeholder: '예: 새벽 도서관', maxLength: 20, required: true, value: name })),
          h('div', { class: 'field' }, h('span', {}, '자리 수'),
            h('div', { class: 'row' }, [4, 6, 8].map((n) => seg(`${n}명`, options.max === n, () => { options.max = n; draw(); })))),
          h('div', { class: 'field' }, h('span', {}, '공개 범위'),
            h('div', { class: 'row' },
              seg('공개방', !options.private, () => { options.private = false; draw(); }),
              seg('비공개방', options.private, () => { options.private = true; draw(); })),
            h('small', {}, options.private ? '영문+숫자 6자리 입장 코드가 만들어져요' : '누구나 목록에서 보고 들어올 수 있어요')),
          h('div', { class: 'row end' },
            h('button', { type: 'button', class: 'btn ghost', onClick: () => element.close() }, '취소'),
            h('button', { type: 'submit', class: 'btn primary' }, '만들고 입장'))));
      }

      async function create(e) {
        e.preventDefault();
        const button = e.target.querySelector('[type="submit"]');
        button.disabled = true;
        try {
          const { room } = await post('/rooms', { ...options, name: new FormData(e.target).get('name') });
          element.close();
          ctx.go(`#/room/${room.id}`);
        } catch (err) {
          toast(err.message);
        } finally {
          button.disabled = false;
        }
      }

      draw();
      return {
        element,
        open() {
          draw();
          element.showModal();
          element.querySelector('input').focus();
        },
      };
    }
  scene.js: |
    // Three.js 장면: 렌더러·카메라·조명·블룸, 좌석 클릭, 멤버 상태 → 캐릭터 반영
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { characterKey, createCharacter } from './characters.js';
    import { currentHours, daylightAt } from './daylight.js';
    import { ROOM, buildRoom } from './room-model.js';

    const DAYLIGHT_REFRESH_MS = 60_000;
    // 마주 보는 두 줄의 얼굴이 모두 보이도록 책상 섬의 옆(+x)쪽에서 창을 향해 비스듬히 내려다본다
    // (정측면이면 같은 줄 캐릭터가 일렬로 겹치므로 약 72°)
    const CAMERA_TARGET = new THREE.Vector3(0.1, 1.25, -0.5);
    const CAMERA_POS = CAMERA_TARGET.clone().add(new THREE.Vector3(10.6, 5.3, 3.4));
    const BACKGROUND = { night: new THREE.Color('#1e1a17'), day: new THREE.Color('#c9c0b2') };

    function webglAvailable() {
      try {
        return !!document.createElement('canvas').getContext('webgl2');
      } catch {
        return false;
      }
    }

    /** 창으로 들어오는 햇빛(밤에는 달빛) + 하늘빛 주변광. 세기와 색은 applyDaylight가 시각에 맞춰 바꾼다. */
    function lights(scene) {
      const ambient = new THREE.HemisphereLight('#ffffff', '#8a7458', 1);
      const sun = new THREE.DirectionalLight('#ffffff', 1);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 50 });
      sun.shadow.bias = -0.0005;
      scene.add(ambient, sun);
      return { ambient, sun };
    }

    function createRenderer(container) {
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      container.append(renderer.domElement);
      return renderer;
    }

    export function createScene(container, { seatCount, onSeatClick, onDaylight }) {
      if (!webglAvailable()) {
        container.append(Object.assign(document.createElement('p'), {
          className: 'empty', textContent: '이 브라우저는 WebGL을 지원하지 않아 3D 공부방을 표시할 수 없어요.',
        }));
        return { update() {}, destroy() {} };
      }

      const renderer = createRenderer(container);
      const labels = Object.assign(document.createElement('div'), { className: 'label-layer' });
      container.append(labels);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
      const light = lights(scene);
      const room = buildRoom(scene, seatCount);

      /** 현재 시각의 하늘·빛을 장면에 적용한다 (1분마다) */
      function applyDaylight() {
        const d = daylightAt(currentHours());
        room.sky.draw(d);
        // 창(-x) 바깥에서 들어오는 빛: 고도가 높을수록 위에서, 시간이 흐르면 z 방향으로 이동
        light.sun.position.set(-ROOM.width / 2 - 8, 2 + d.elevation * 14, (d.progress - 0.5) * 16);
        light.sun.color.copy(d.sunColor);
        light.sun.intensity = d.sunIntensity;
        light.ambient.color.copy(d.skyTop).lerp(new THREE.Color('#ffffff'), 0.55);
        light.ambient.intensity = d.ambient;
        room.lamps.forEach((lamp) => lamp.setLevel(d.lamp));
        scene.background = BACKGROUND.night.clone().lerp(BACKGROUND.day, Math.min(1, d.sunIntensity / 2.8));
        onDaylight?.(d);
      }
      applyDaylight();
      const daylightTimer = setInterval(applyDaylight, DAYLIGHT_REFRESH_MS);
      const characters = new Map();            // seat → character
      let pickable = true;

      // 빛나는 물체(스탠드 갓·노트북 화면)만 번지게 하는 블룸
      const composer = new EffectComposer(renderer);
      const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.5, 0.6, 0.9);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(bloom);
      composer.addPass(new OutputPass());

      function resize() {
        const { clientWidth: w, clientHeight: h } = container;
        camera.aspect = w / h || 1;
        // 세로로 좁은 화면에서는 카메라를 뒤로 물려 방 전체가 보이게
        const distance = Math.max(1, 1.55 / camera.aspect);
        camera.position.copy(CAMERA_TARGET).addScaledVector(CAMERA_POS.clone().sub(CAMERA_TARGET), distance);
        camera.lookAt(CAMERA_TARGET);
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        composer.setSize(w, h);
      }
      const observer = new ResizeObserver(resize);
      observer.observe(container);

      // ---------- 좌석 클릭 ----------
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      function seatAt(e) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
        raycaster.setFromCamera(pointer, camera);
        if (!pickable) return null;
        // 앞에 앉은 사람의 좌석에 가려져도 그 뒤의 빈 좌석을 고를 수 있게, 가까운 순서로 빈 자리를 찾는다
        const hits = raycaster.intersectObjects(room.seats.map((s) => s.hitbox));
        return hits.map((hit) => hit.object.userData.seat).find((seat) => !characters.has(seat)) ?? null;
      }
      const onMove = (e) => { renderer.domElement.style.cursor = seatAt(e) != null ? 'pointer' : ''; };
      const onClick = (e) => {
        const seat = seatAt(e);
        if (seat != null) onSeatClick(seat);
      };
      renderer.domElement.addEventListener('pointermove', onMove);
      renderer.domElement.addEventListener('click', onClick);

      // ---------- 렌더 루프 ----------
      const projected = new THREE.Vector3();
      function placeLabels() {
        const { clientWidth: w, clientHeight: h } = container;
        for (const c of characters.values()) {
          projected.setFromMatrixPosition(c.labelAnchor.matrixWorld).project(camera);
          c.label.style.transform = `translate(${((projected.x + 1) / 2) * w}px, ${((1 - projected.y) / 2) * h}px) translate(-50%, -100%)`;
        }
      }

      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const dt = clock.getDelta();
        const t = clock.elapsedTime;
        for (const s of room.seats) {
          s.marker.visible = pickable && !characters.has(s.index);
          s.marker.material.opacity = 0.45 + Math.sin(t * 3) * 0.25;
          s.laptop.setOn(characters.get(s.index)?.status === 'STUDYING');
        }
        for (const c of characters.values()) c.tick(t, dt);
        composer.render();
        placeLabels();
      });

      function removeCharacter(seat) {
        const c = characters.get(seat);
        room.seats[seat].anchor.remove(c.root);
        c.dispose();
        characters.delete(seat);
      }

      return {
        /** members: 하트비트 응답의 멤버 목록. 좌석에 앉은 사람만 캐릭터로 그린다. */
        update(members, myId, canPick) {
          pickable = canPick;
          const bySeat = new Map(members.filter((m) => m.seat != null).map((m) => [m.seat, m]));
          for (const seat of [...characters.keys()]) {
            const m = bySeat.get(seat);
            if (!m || characters.get(seat).key !== characterKey(m)) removeCharacter(seat);
          }
          for (const [seat, m] of bySeat) {
            if (!characters.has(seat)) {
              const c = createCharacter(m);
              characters.set(seat, c);
              room.seats[seat].anchor.add(c.root);
              labels.append(c.label);
            }
            characters.get(seat).update(m, m.id === myId);
          }
        },
        destroy() {
          clearInterval(daylightTimer);
          renderer.setAnimationLoop(null);
          observer.disconnect();
          for (const seat of [...characters.keys()]) removeCharacter(seat);
          scene.traverse((o) => o.geometry?.dispose());
          composer.dispose();
          renderer.dispose();
          renderer.domElement.remove();
          labels.remove();
        },
      };
    }
  shell.js: |
    // 공부방·플래너·캐릭터 페이지가 함께 쓰는 상단 바: 로고 · 페이지 탭 · 오늘 공부시간 · 프로필 메뉴
    import { get } from './api.js';
    import { characterOf, fill, fmtShort, h } from './ui.js';

    const PAGES = [['rooms', '공부방'], ['planner', '플래너'], ['character', '캐릭터']];

    export function mountShell(root, ctx, active) {
      const todayChip = h('span', { class: 'chip today-chip' }, '오늘 0분');
      const profileBox = h('div', { class: 'profile' });
      const main = h('main', { class: `page page-${active}` });
      let menuOpen = false;

      root.append(
        h('header', { class: 'app-header' },
          h('a', { class: 'logo small', href: '#/rooms', 'aria-label': 'StudyPals 공부방' },
            h('span', { class: 'brand-mark', 'aria-hidden': 'true' }, 's'), 'StudyPals'),
          h('nav', { class: 'nav-tabs', 'aria-label': '주 메뉴' },
            PAGES.map(([page, label]) => h('a', { class: `nav-tab${page === active ? ' on' : ''}`, href: `#/${page}`,
              'aria-current': page === active ? 'page' : null }, label))),
          h('div', { class: 'header-right' }, todayChip, profileBox)),
        main);

      // ---------- 프로필 메뉴 ----------

      function drawProfile() {
        const me = characterOf(ctx.user.character);
        fill(profileBox,
          h('button', { class: 'profile-btn', 'aria-expanded': String(menuOpen), onClick: toggleMenu },
            h('span', { class: 'avatar', style: `--c:${me.color}` }, me.emoji),
            h('strong', {}, ctx.user.name), h('span', { class: 'caret' }, '▾')),
          menuOpen && h('div', { class: 'popover card' },
            h('div', { class: 'row' }, h('span', { class: 'avatar big', style: `--c:${me.color}` }, me.emoji),
              h('div', {}, h('strong', {}, ctx.user.name), h('br'), h('small', {}, `@${ctx.user.username} · ${me.label}`))),
            h('a', { class: 'btn small', href: '#/character' }, '캐릭터 바꾸기'),
            h('button', { class: 'btn ghost small', onClick: ctx.logout }, '로그아웃')));
      }

      function toggleMenu(e) {
        e.stopPropagation();
        menuOpen = !menuOpen;
        drawProfile();
      }

      const closeMenu = (e) => {
        if (menuOpen && !profileBox.contains(e.target)) {
          menuOpen = false;
          drawProfile();
        }
      };
      document.addEventListener('click', closeMenu);

      drawProfile();
      get('/me').then(({ today }) => { todayChip.textContent = `오늘 ${fmtShort(today.totalSec)}`; }).catch(() => {});

      return {
        main,
        setToday(sec) { todayChip.textContent = `오늘 ${fmtShort(sec)}`; },
        /** 캐릭터를 바꾼 뒤 상단 아바타를 다시 그린다 */
        refreshProfile: drawProfile,
        destroy() { document.removeEventListener('click', closeMenu); },
      };
    }
  textures.js: |
    // 캔버스로 그리는 텍스처 — 이미지 파일 없이 코드로만 만든다 (ConfigMap 용량 절약)
    import * as THREE from 'three';

    const cache = new Map();
    const rand = (a, b) => a + Math.random() * (b - a);

    function makeCanvas(w, h) {
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      return canvas;
    }

    function toTexture(canvas, repeat = [1, 1]) {
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(...repeat);
      texture.anisotropy = 4;
      return texture;
    }

    function cached(key, size, draw, repeat) {
      if (!cache.has(key)) {
        const canvas = makeCanvas(...size);
        draw(canvas.getContext('2d'), ...size);
        cache.set(key, toTexture(canvas, repeat));
      }
      return cache.get(key);
    }

    /** 밝은 원목 마루 */
    export const woodFloor = () => cached('wood', [512, 512], (ctx, w, h) => {
      const planks = 8;
      const pw = w / planks;
      for (let i = 0; i < planks; i++) {
        ctx.fillStyle = `hsl(33, ${rand(30, 38)}%, ${rand(62, 70)}%)`;
        ctx.fillRect(i * pw, 0, pw, h);
        ctx.strokeStyle = 'rgba(120,80,40,0.10)';
        for (let g = 0; g < 6; g++) {                  // 나뭇결
          ctx.beginPath();
          const x = i * pw + rand(4, pw - 4);
          ctx.moveTo(x, 0);
          ctx.bezierCurveTo(x + rand(-6, 6), h / 3, x + rand(-6, 6), (h * 2) / 3, x, h);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(90,60,30,0.35)';
        ctx.fillRect(i * pw, 0, 2, h);
        ctx.fillRect(i * pw, rand(0, h), pw, 2);
      }
    }, [3, 3]);

    /** 노트북 화면: 코드 에디터처럼 보이는 색 줄 */
    export const codeScreen = () => cached('screen', [256, 160], (ctx, w, h) => {
      ctx.fillStyle = '#1e2433';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#2a3245';
      ctx.fillRect(0, 0, 40, h);
      const colors = ['#7aa2f7', '#9ece6a', '#e0af68', '#bb9af7', '#7dcfff', '#f7768e'];
      for (let y = 10; y < h - 8; y += 11) {
        let x = 48 + Math.floor(rand(0, 3)) * 12;
        for (let p = Math.floor(rand(1, 4)); p > 0; p--) {
          const len = rand(18, 60);
          ctx.fillStyle = colors[Math.floor(rand(0, colors.length))];
          ctx.fillRect(x, y, len, 5);
          x += len + 6;
        }
      }
    });

    /**
     * 창밖 풍경: 하늘 그라데이션 + 해/달 + 별 + 숲 실루엣.
     * draw(daylight)를 호출하면 같은 캔버스에 다시 그린다.
     */
    export function createSkyView() {
      const W = 1024;
      const H = 512;
      const HORIZON = H * 0.62;
      const canvas = makeCanvas(W, H);
      const ctx = canvas.getContext('2d');
      const texture = toTexture(canvas);
      const stars = Array.from({ length: 90 }, () => [rand(0, W), rand(0, HORIZON * 0.9), rand(0.6, 1.8)]);
      // 나무는 지평선 근처에만 두 겹(먼 숲은 작고 흐리게, 가까운 숲은 크고 진하게) — 하늘이 충분히 보이도록
      const forest = (count, minR, maxR, offset) =>
        Array.from({ length: count }, (_, i) => [i * (W / (count - 4)) + rand(-12, 12), HORIZON + offset + rand(0, 10), rand(minR, maxR)]);
      const farTrees = forest(70, 10, 20, -4);
      const nearTrees = forest(46, 18, 32, 14);

      function drawBody(d) {
        const x = W * (0.1 + d.progress * 0.8);
        const y = HORIZON - d.elevation * HORIZON * 0.75;
        const sun = d.body === 'sun';
        const r = sun ? 34 : 24;
        const halo = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * (sun ? 5 : 3));
        halo.addColorStop(0, sun ? 'rgba(255,240,200,0.65)' : 'rgba(220,230,255,0.35)');
        halo.addColorStop(1, 'rgba(255,240,200,0)');
        ctx.fillStyle = halo;
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = sun ? `#${d.sunColor.clone().lerp(new THREE.Color('#ffffff'), 0.5).getHexString()}` : '#eef1ff';
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawLayer(trees, base, highlight) {
        for (const [x, y, r] of trees) {
          ctx.fillStyle = `#${base.getHexString()}`;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `#${highlight.getHexString()}`;
          ctx.beginPath();
          ctx.arc(x - r * 0.3, y - r * 0.25, r * 0.45, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawTrees(d) {
        // 낮에는 초록, 밤에는 어두운 실루엣. 먼 숲은 하늘색이 섞여 흐리게 보인다.
        const light = Math.min(1, d.sunIntensity / 2.6);
        const near = new THREE.Color('#0d1712').lerp(new THREE.Color('#4d7d43'), light);
        const far = near.clone().lerp(d.horizon, 0.35);
        const shine = (c) => c.clone().lerp(new THREE.Color('#9cc77c'), 0.35 * light);
        drawLayer(farTrees, far, shine(far));
        ctx.fillStyle = `#${near.getHexString()}`;
        ctx.fillRect(0, HORIZON + 22, W, H);
        drawLayer(nearTrees, near, shine(near));
      }

      return {
        texture,
        draw(d) {
          const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
          sky.addColorStop(0, `#${d.skyTop.getHexString()}`);
          sky.addColorStop(1, `#${d.horizon.getHexString()}`);
          ctx.fillStyle = sky;
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = `rgba(255,255,255,${d.stars})`;
          for (const [x, y, r] of stars) ctx.fillRect(x, y, r, r);
          drawBody(d);
          drawTrees(d);
          texture.needsUpdate = true;
        },
      };
    }
  timetable.js: |
    // 플래너 시간표: 6시 ~ 다음 날 5시, 한 줄 = 1시간, 한 칸 = 10분
    // 계획: 과목(붓)을 고르고 칸을 누르거나 드래그해서 칠한다 (마우스·터치 모두)
    // 실제: 그 10분 동안 5분 이상 공부했으면 칸 아래에 진한 막대를 그린다
    import { h } from './ui.js';

    const HOURS = Array.from({ length: 24 }, (_, i) => (i + 6) % 24);
    const ACTUAL_MIN_SEC = 300;
    const ERASER = '';

    const slotNow = () => {
      const now = new Date();
      return Math.floor((now.getHours() * 60 + now.getMinutes()) / 10);
    };

    /** @param save(cells) 칠하기를 마칠 때 {칸 번호: subjectId} 전체를 저장 */
    export function timetable(data, { save }) {
      const cells = { ...data.day.timetable };
      const colorOf = (id) => data.subjects.find((s) => s.id === id)?.color;
      const nowSlot = data.editable ? slotNow() : -1;
      let brush = data.subjects[0]?.id ?? ERASER;
      let painting = false;
      let changed = false;

      function paint(cell) {
        const id = cells[cell.dataset.slot];
        cell.classList.toggle('planned', Boolean(id));
        cell.style.setProperty('--c', colorOf(id) ?? 'transparent');
      }

      const grid = h('div', { class: `tt-grid${data.editable ? ' editable' : ''}` },
        HOURS.map((hour) => h('div', { class: 'tt-row' },
          h('span', { class: 'tt-hour' }, hour),
          Array.from({ length: 6 }, (_, i) => {
            const slot = hour * 6 + i;
            const cell = h('div', { class: `tt-cell${slot === nowSlot ? ' now' : ''}`, 'data-slot': slot },
              (data.study.bySlot[slot] ?? 0) >= ACTUAL_MIN_SEC && h('i', { class: 'tt-actual' }));
            paint(cell);
            return cell;
          }))));

      // 드래그 중에는 포인터 아래 칸을 찾아 칠한다 (터치는 포인터를 캡처하므로 좌표로 찾는다)
      function brushAt(e) {
        const cell = document.elementFromPoint(e.clientX, e.clientY)?.closest('.tt-cell');
        if (!cell || !grid.contains(cell)) return;
        const slot = cell.dataset.slot;
        if ((cells[slot] ?? ERASER) === brush) return;
        if (brush === ERASER) delete cells[slot];
        else cells[slot] = brush;
        changed = true;
        paint(cell);
      }

      function finish() {
        if (painting && changed) save(cells);
        painting = changed = false;
      }

      if (data.editable) {
        grid.addEventListener('pointerdown', (e) => { painting = true; brushAt(e); });
        grid.addEventListener('pointermove', (e) => painting && brushAt(e));
        grid.addEventListener('pointerup', finish);
        grid.addEventListener('pointerleave', finish);
      }

      const palette = h('div', { class: 'tt-palette' });
      function drawPalette() {
        const pick = (id, label, color) => h('button', {
          type: 'button', class: `tt-brush${brush === id ? ' on' : ''}`, style: `--c:${color}`,
          onClick: () => { brush = id; drawPalette(); },
        }, h('i', { class: 'dot' }), label);
        palette.replaceChildren(
          ...data.subjects.map((s) => pick(s.id, s.name, s.color)),
          pick(ERASER, '지우개', '#ffffff'));
      }
      if (data.editable && data.subjects.length) drawPalette();

      return h('div', { class: 'timetable' },
        h('div', { class: 'sheet-label' }, 'TIMETABLE'),
        data.editable && (data.subjects.length
          ? h('small', {}, '과목을 고르고 칸을 칠해 시간대별 계획을 세워요')
          : h('small', {}, '과목을 만들면 시간표를 칠할 수 있어요')),
        palette,
        grid,
        h('small', { class: 'tt-legend' }, h('i', { class: 'tt-actual' }), ' 실제로 공부한 10분'));
    }
  ui.js: |
    // DOM 생성·포맷 유틸과 화면 공용 상수

    /** 고를 수 있는 캐릭터. animal은 3D 모델 종류, color는 털 색 (서버 auth.CHARACTERS와 같은 id) */
    export const CHARACTERS = {
      bear: { label: '곰', emoji: '🐻', animal: 'bear', color: '#c69c72' },
      rabbit: { label: '토끼', emoji: '🐰', animal: 'rabbit', color: '#f5efe4' },
      'cat-black': { label: '검은 고양이', emoji: '🐈‍⬛', animal: 'cat', color: '#2f2c2e' },
      'cat-white': { label: '하얀 고양이', emoji: '🐱', animal: 'cat', color: '#f7f4ee' },
      dog: { label: '갈색 강아지', emoji: '🐶', animal: 'dog', color: '#b7793f' },
    };
    export const characterOf = (id) => CHARACTERS[id] ?? CHARACTERS.bear;
    export const SUBJECT_COLORS = ['#e76f51', '#f4a261', '#e9c46a', '#2a9d8f', '#5b8bd9', '#9b72cf', '#d36c9a', '#6d9f71'];
    export const STATUS = {
      STUDYING: { label: '공부 중', emoji: '📖' },
      AWAY: { label: '자리 비움', emoji: '📱' },
      BREAK: { label: '휴식 중', emoji: '☕' },
      IDLE: { label: '대기', emoji: '💤' },
    };

    /** h('button', { class: 'btn', onClick }, '텍스트') 형태로 요소를 만든다. */
    export function h(tag, props = {}, ...children) {
      const el = document.createElement(tag);
      for (const [key, value] of Object.entries(props)) {
        if (value == null || value === false) continue;
        if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), value);
        else if (key === 'class') el.className = value;
        else if (key === 'style') el.style.cssText = value;
        else if (key in el) el[key] = value;
        else el.setAttribute(key, value === true ? '' : value);
      }
      el.append(...toNodes(children));
      return el;
    }

    /** 조건부 자식(null·false)은 빼고 문자열은 텍스트로 */
    const toNodes = (children) => children.flat().filter((c) => c != null && c !== false)
      .map((c) => (c instanceof Node ? c : String(c)));

    /** el.replaceChildren와 같지만 h()처럼 null·false를 걸러 낸다 */
    export function fill(el, ...children) {
      el.replaceChildren(...toNodes(children));
      return el;
    }

    export function swatches(colors, selected, onPick) {
      return h('div', { class: 'swatches', role: 'radiogroup' },
        colors.map((c) => h('button', {
          type: 'button', class: `swatch${c === selected ? ' on' : ''}`, style: `--c:${c}`,
          'aria-label': c, onClick: () => onPick(c),
        })));
    }

    export const fmtClock = (sec) =>
      [sec / 3600, (sec % 3600) / 60, sec % 60].map((n) => String(Math.floor(n)).padStart(2, '0')).join(':');

    // 날짜는 서버와 같은 YYYYMMDD 문자열로 주고받는다
    const parseYmd = (s) => new Date(Number(s.slice(0, 4)), Number(s.slice(4, 6)) - 1, Number(s.slice(6, 8)));
    const toYmd = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;

    /** "10.29 (목)" */
    export function fmtDate(ymd) {
      const d = parseYmd(ymd);
      return `${d.getMonth() + 1}.${d.getDate()} (${'일월화수목금토'[d.getDay()]})`;
    }

    export function shiftDate(ymd, days) {
      const d = parseYmd(ymd);
      d.setDate(d.getDate() + days);
      return toYmd(d);
    }

    export function fmtShort(sec) {
      const hours = Math.floor(sec / 3600);
      const mins = Math.floor((sec % 3600) / 60);
      return hours ? `${hours}시간 ${mins}분` : `${mins}분`;
    }

    let toastTimer;
    export function toast(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
    }
  views.css: |
    /* 화면별 레이아웃: 로그인 · 상단 바 · 공부방 목록 · 플래너 (3D 공부방은 room.css) */

    /* ---------- 로그인 ---------- */
    .auth-page {
      min-height: 100%;
      display: grid; grid-template-columns: 1fr minmax(320px, 420px); gap: 40px;
      align-items: center; max-width: 980px; margin: 0 auto; padding: 32px 16px;
    }
    .auth-hero p { font-size: 1.2rem; margin: 4px 0 18px; }
    .hero-animals { font-size: 2.4rem; letter-spacing: 6px; }
    .hero-points { padding-left: 20px; color: var(--muted); line-height: 2; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .tab { flex: 1; padding: 10px; border: 0; border-radius: 12px; background: #f4ead8; font-family: var(--font-title); cursor: pointer; }
    .tab.on { background: var(--leaf); color: #fff; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field > span { font-family: var(--font-title); }

    /* ---------- 상단 바 (공부방·플래너 공통) ---------- */
    .app-header {
      position: sticky; top: 0; z-index: 10;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
      padding: 12px max(16px, calc((100% - 1160px) / 2));
      background: rgba(251, 244, 230, 0.88); backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--line);
    }
    .app-header .logo { text-decoration: none; }
    .nav-tabs { display: flex; gap: 4px; padding: 4px; background: #f1e6d2; border-radius: 999px; }
    .nav-tab {
      padding: 8px 18px; border-radius: 999px; text-decoration: none; color: var(--muted);
      font-family: var(--font-title); white-space: nowrap;
    }
    .nav-tab:hover { color: var(--ink); }
    .nav-tab.on { background: var(--paper); color: var(--ink); box-shadow: 0 2px 0 #dccaa9; }
    .header-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
    .today-chip { background: #e7f3df; color: var(--leaf-dark); }

    .profile { position: relative; }
    .profile-btn {
      display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px;
      border: 2px solid var(--line); border-radius: 999px; background: var(--paper); cursor: pointer;
    }
    .profile-btn:hover { border-color: var(--leaf); }
    .caret { color: var(--muted); font-size: 0.8rem; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--c); display: grid; place-items: center; font-size: 1.1rem; flex: none; }
    .avatar.big { width: 52px; height: 52px; font-size: 1.7rem; }
    .popover {
      position: absolute; right: 0; top: calc(100% + 8px); width: 300px; z-index: 20;
      display: flex; flex-direction: column; gap: 12px;
    }
    .char-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .char {
      display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px;
      border: 2px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer;
    }
    .char:hover { border-color: var(--leaf); }
    .char.on { border-color: var(--leaf); background: #eef7e8; }
    .popover .row { flex-wrap: nowrap; }
    .popover a.btn { text-align: center; text-decoration: none; color: inherit; }

    /* ---------- 캐릭터 페이지 ---------- */
    .character-layout { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
    .preview-card { display: flex; flex-direction: column; gap: 14px; }
    .preview-stage {
      height: 420px; border-radius: 14px; display: grid; place-items: center; overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #fffaf0 0, #f4ead8 70%);
    }
    .preview-stage canvas { display: block; }
    .preview-info { display: flex; flex-direction: column; gap: 6px; }
    .char-grid.big { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
    .char-grid.big .char { position: relative; padding: 16px 6px; }
    .char-grid.big .avatar.big { width: 64px; height: 64px; font-size: 2.1rem; }
    .char .badge { position: absolute; top: 6px; right: 6px; font-size: 0.7rem; padding: 2px 6px; background: var(--leaf); color: #fff; }

    /* ---------- 페이지 공통 ---------- */
    .page { max-width: 1160px; margin: 0 auto; padding: 28px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
