      .today-chip { display: none; }
      .page-actions, .code-join { width: 100%; }
      .code-input { flex: 1; }
    }
  vision.js: |
    // 브라우저 안에서 도는 초경량 얼굴 감지 (MediaPipe BlazeFace, 약 230KB)
    // 카메라 영상은 서버로 보내지 않고, "자리에 있음/없음" 판정만 앱에 알린다.

    const MEDIAPIPE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';

    const INTERVAL_MS = 5000;   // 5초마다 한 번 감지
    const INPUT_SIZE = 256;     // 모델에 넣을 정사각형 크기
    const WINDOW = 6;           // 최근 6번의 결과 중
    const THRESHOLD = 4;        // 4번 이상 같으면 상태를 바꾼다 (순간적인 오탐에 흔들리지 않게)

    /**
     * @param onChange(present: boolean)  상태가 바뀔 때만 호출
     * @param onSample(detected: boolean) 매 감지마다 호출 (표시등용)
     */
    export async function startPresence({ onChange, onSample }) {
      const { FilesetResolver, FaceDetector } = await import(`${MEDIAPIPE}/vision_bundle.mjs`);
      const fileset = await FilesetResolver.forVisionTasks(`${MEDIAPIPE}/wasm`);
      const detector = await FaceDetector.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MODEL, delegate: 'CPU' },
        runningMode: 'VIDEO',
        minDetectionConfidence: 0.4,
      });

      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 }, audio: false });
      const video = Object.assign(document.createElement('video'), { srcObject: stream, muted: true, playsInline: true });
      await video.play();

      // 노트북 카메라는 요청과 달리 16:9로 주는 경우가 많다. 넓은 화면을 그대로 넣으면 모델 입력(정사각형)에서
      // 얼굴이 작고 찌그러져 놓치므로, 세로 높이 기준으로 가운데 정사각형만 잘라서 넣는다 (미리보기에 보이는 영역과 비슷).
      const canvas = Object.assign(document.createElement('canvas'), { width: INPUT_SIZE, height: INPUT_SIZE });
      const ctx = canvas.getContext('2d');
      function centerSquare() {
        const { videoWidth: w, videoHeight: h } = video;
        const side = Math.min(w, h);
        ctx.drawImage(video, (w - side) / 2, (h - side) / 2, side, side, 0, 0, INPUT_SIZE, INPUT_SIZE);
        return canvas;
      }

      const history = [];
      let present = true;   // 공부 시작 직후에는 자리에 있다고 본다

      function sample() {
        if (video.readyState < 2) return;
        const detected = detector.detectForVideo(centerSquare(), performance.now()).detections.length > 0;
        history.push(detected);
        if (history.length > WINDOW) history.shift();
        onSample?.(detected);

        const hits = history.filter(Boolean).length;
        const misses = history.length - hits;
        const next = hits >= THRESHOLD ? true : misses >= THRESHOLD ? false : present;
        if (next !== present) {
          present = next;
          onChange(present);
        }
      }

      sample();
      const timer = setInterval(sample, INTERVAL_MS);

      return {
        video,
        stop() {
          clearInterval(timer);
          stream.getTracks().forEach((t) => t.stop());
          detector.close();
        },
      };
    }
  workspace.css: |
    /* 일반 페이지 전용. 3D 공부방(.room-screen)과 렌더러에는 적용하지 않는다. */
    body:has(.auth-page, .app-header) { background: #f6f5f0; }

    :is(.auth-page, .app-header, .page) {
      --paper: #fffefa;
      --ink: #2d3831;
      --muted: #70766e;
      --line: #dddfd5;
      --leaf: #385b47;
      --leaf-dark: #2c4939;
      --radius: 6px;
      --shadow: none;
      --font-title: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-hand: var(--font-body);
      color: var(--ink);
      font: 14px/1.65 var(--font-body);
      letter-spacing: -0.025em;
      -webkit-font-smoothing: antialiased;
    }
    :is(.auth-page, .app-header, .page) :is(h1, h2, h3) { font-weight: 650; line-height: 1.4; }
    :is(.auth-page, .app-header, .page) h2 { font-size: 17px; }
    :is(.auth-page, .app-header, .page) small { font-size: 12px; }
    :is(.auth-page, .app-header, .page) .card { border-width: 1px; padding: 24px; }
    :is(.auth-page, .app-header, .page) :is(button, a, input, select, summary):focus-visible {
      outline: 2px solid var(--leaf); outline-offset: 4px;
    }
    :is(.auth-page, .app-header, .page) :is(input, select) {
      padding: 10px 12px; min-height: 42px; border-width: 1px; border-radius: 4px; background: #fffefa;
    }
    :is(.auth-page, .app-header, .page) input::placeholder { color: #90958b; }
    :is(.auth-page, .app-header, .page) .btn {
      padding: 10px 18px; border: 1px solid var(--line); border-radius: 4px;
      background: var(--paper); font-size: 13px; font-weight: 600; box-shadow: none;
      transition: background 120ms, border-color 120ms;
    }
    :is(.auth-page, .app-header, .page) .btn:hover:enabled { background: #eeefe7; border-color: #a7b2a4; }
    :is(.auth-page, .app-header, .page) .btn.primary { background: var(--leaf); border-color: var(--leaf); box-shadow: none; }
    :is(.auth-page, .app-header, .page) .btn.primary:hover:enabled { background: var(--leaf-dark); }
    :is(.auth-page, .app-header, .page) .btn:active { transform: none; box-shadow: none; }
    :is(.auth-page, .app-header, .page) .btn.small { padding: 7px 12px; font-size: 12px; }
    :is(.auth-page, .app-header, .page) .btn.ghost { border-width: 1px; background: transparent; }
    :is(.auth-page, .app-header, .page) .icon:hover { background: #eeefe7; }
    :is(.auth-page, .app-header, .page) .badge { background: #edf0e7; color: #52614f; font-size: 11px; padding: 3px 9px; border-radius: 3px; }
    :is(.auth-page, .app-header, .page) .badge.private { background: #f1e9de; color: #855e37; cursor: default; }
    :is(.auth-page, .app-header, .page) .seg { padding: 8px 20px; border-width: 1px; border-radius: 4px; font-size: 13px; }
    :is(.auth-page, .app-header, .page) .seg.on { background: #e9eee5; color: var(--leaf-dark); }
    :is(.auth-page, .app-header, .page) .field { gap: 8px; }
    :is(.auth-page, .app-header, .page) .field > span { font-size: 13px; font-weight: 600; }
    :is(.auth-page, .app-header) .logo {
      display: inline-flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none;
      font: 600 24px Georgia, 'Times New Roman', serif; letter-spacing: -1px;
    }
    .brand-mark {
      display: inline-grid; place-items: center; width: 28px; height: 30px;
      border-radius: 2px 9px 2px 2px; background: #385b47; color: #fffefa;
      font: italic 25px Georgia, serif; padding-right: 2px; letter-spacing: -2px;
    }
    .eyebrow { display: block; color: #798173; font-size: 12px; font-weight: 500; margin-bottom: 10px; letter-spacing: 0; }

    /* 로그인: 여백과 구분선으로 구성한 도서관 안내 데스크. */
    .auth-page {
      grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto 1fr;
      column-gap: 100px; row-gap: 72px; max-width: 1096px; min-height: 100svh;
      padding: 40px 32px 80px; align-content: start;
    }
    .auth-brand { grid-column: 1 / -1; justify-self: start; }
    .auth-hero { padding-bottom: 16px; }
    .auth-hero h1 { font-size: clamp(32px, 3.6vw, 46px); letter-spacing: -0.06em; line-height: 1.4; font-weight: 650; }
    .auth-hero .auth-description { margin: 24px 0 36px; font-size: 14px; color: var(--muted); line-height: 1.9; word-break: keep-all; }
    .hero-points { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .hero-points li { display: flex; gap: 20px; padding: 17px 0; border-bottom: 1px solid var(--line); }
    .hero-points li > span { font: 14px/1.8 Georgia, serif; color: #a27b4e; }
    .hero-points strong { font-size: 13px; font-weight: 600; color: var(--ink); }
    .hero-points li p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
    .auth-page .auth-card { padding: 32px; border-top: 3px solid var(--leaf); align-self: center; }
    .auth-card-heading { margin-bottom: 28px; }
    .auth-card-heading h2 { font-size: 20px; letter-spacing: -0.04em; }
    .auth-card-heading p { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
    .auth-card .tabs { gap: 0; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
    .auth-card .tab { padding: 10px 8px 12px; border-radius: 0; background: transparent; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13px; }
    .auth-card .tab.on { border-bottom-color: var(--leaf); background: transparent; color: var(--leaf); font-weight: 650; }
    .auth-card .stack { gap: 20px; }
    .auth-card .btn.primary { margin-top: 4px; padding: 12px; }

    /* 상단 탐색 */
    .app-header {
      grid-template-columns: 1fr auto 1fr; min-height: 78px; padding: 0 max(24px, calc((100% - 1120px) / 2));
      gap: 28px; background: #fffefa; border-bottom: 1px solid #dddfd5; backdrop-filter: none;
    }
    .app-header .logo.small { font-size: 23px; }
    .app-header .nav-tabs { height: 78px; padding: 0; gap: 32px; border-radius: 0; background: none; align-items: stretch; }
    .app-header .nav-tab { display: flex; align-items: center; padding: 0 3px; border-radius: 0; border-bottom: 2px solid transparent; font-size: 13px; }
    .app-header .nav-tab.on { color: var(--leaf); background: none; border-bottom-color: var(--leaf); box-shadow: none; font-weight: 650; }
    .app-header .header-right { gap: 20px; }
    .app-header .today-chip { padding: 0; font-size: 12px; background: none; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .app-header .profile-btn { border: 0; background: none; padding: 4px 0; gap: 8px; border-radius: 4px; font-size: 12px; }
    .app-header .profile-btn strong { max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
    .app-header .avatar { width: 29px; height: 29px; font-size: 15px; }
    .app-header .popover { width: 270px; box-shadow: 0 6px 20px #2d383114; }

    /* 페이지와 공부방 */
    .page { max-width: 1168px; padding: 50px 24px 64px; gap: 28px; }
    .page-head { align-items: center; padding-bottom: 32px; border-bottom: 1px solid var(--line); }
    .page-head h1 { font-size: 34px; letter-spacing: -0.06em; }
    .page-head p { font-size: 13px; margin-top: 10px; line-height: 1.7; word-break: keep-all; }
    .rooms-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .rooms-heading { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .rooms-heading h2 { font-size: 15px; }
    .room-count { font: 13px var(--font-body); color: var(--muted); }
    .page .code-join { align-items: center; gap: 8px; }
    .code-join label { color: var(--muted); font-size: 12px; margin-right: 6px; }
    .page .code-input { width: 136px; min-height: 38px; padding: 8px 10px; font-size: 12px; letter-spacing: 2px; }
    .page .code-input::placeholder { letter-spacing: 0; }
    .page .code-join .btn { padding: 8px 12px; }
    .page .room-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .page .room-card { gap: 20px; min-width: 0; padding: 24px; border-top: 2px solid #81937a; border-radius: 3px; transition: border-color 150ms; }
    .page .room-card:hover { transform: none; border-color: #81937a; }
    .page .room-card.full { border-top-color: #c6c9bf; }
    .room-number { color: #969b8b; font: italic 22px Georgia, serif; }
    .page .room-card h3 { font-size: 20px; font-weight: 600; letter-spacing: -0.04em; }
    .room-occupancy { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .page .seats { gap: 6px; }
    .page .seats i { width: 14px; height: 18px; border: 1px solid #d6dace; border-bottom-width: 3px; border-radius: 3px 3px 1px 1px; background: transparent; }
    .page .seats i.filled { background: #7d9177; border-color: #7d9177; }
    .seat-count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .seat-count strong { font-size: 17px; color: var(--ink); font-weight: 500; }
    .page .room-card-foot { padding-top: 17px; border-top: 1px solid #e9eae1; gap: 4px; }
    .page .room-card-foot small { font-size: 11px; }
    .page .room-card-foot .btn { padding: 6px 9px; font-size: 11px; }
    .rooms-note { display: flex; align-items: center; justify-content: space-between; gap: 14px; color: var(--muted); font-size: 11px; }
    .live-note { display: flex; align-items: center; gap: 7px; }
    .live-note::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #698362; flex-shrink: 0; }
    .live-note.offline::before { background: #ac7a48; }
    .page .empty-state { min-height: 290px; justify-content: center; border: 1px dashed #c9cfc0; background: transparent; box-shadow: none; }
    .page .empty-state h3 { margin-top: 18px; font-size: 17px; }
    .page .empty-state p { margin: 4px 0 18px; font-size: 13px; }
    .empty-book { position: relative; display: block; width: 40px; height: 31px; border: 1px solid #89977d; border-radius: 3px 3px 6px 6px; transform: rotate(-7deg); }
    .empty-book::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px solid #89977d; }
    .empty-book::after { content: ''; position: absolute; left: 5px; right: 5px; bottom: 6px; border-bottom: 1px solid #c5cdba; }
    .page .room-dialog { padding: 30px; border-radius: 6px; }
    .room-dialog .stack { gap: 22px; }
    .room-dialog .dialog-description { margin: -12px 0 2px; color: var(--muted); font-size: 12px; }
    .page .room-dialog::backdrop { background: #202e2759; backdrop-filter: blur(3px); }

    /* 플래너: 종이의 격자와 과목 색은 유지하고, 상자 장식은 덜어낸다. */
    .page-planner .week { padding: 18px 24px; gap: 32px; }
    .page-planner .week-day { border-width: 1px; border-radius: 3px; padding: 10px 4px; gap: 5px; }
    .page-planner .week-day:hover { background: #f0f1e9; }
    .page-planner .week-day.on { background: #edf0e7; border-color: #b7c3ad; }
    .page-planner .week-bar { width: 12px; background: #eef0e7; border-radius: 2px; }
    .page-planner .week-bar i { background: #7d9177; border-radius: 1px; }
    .page-planner .week-day strong { font-size: 11px; font-weight: 500; }
    .page-planner .week-day small { font-size: 11px; }
    .page-planner .planner-grid { grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; }
    .page-planner .sheet { --grid: #68775c08; background-color: #fffefa; background-size: 20px 20px; padding: 24px; gap: 24px; }
    .page-planner .sheet.past { background-color: #f3f3ec; }
    .page-planner .sheet-label { color: #78806f; font-size: 10px; font-weight: 600; letter-spacing: 1px; }
    .page-planner .hand { font-family: var(--font-body); }
    .page-planner .hand.big { color: var(--ink); font-size: 23px; font-weight: 500; letter-spacing: -0.04em; line-height: 1.4; }
    .page-planner .sheet-top { grid-template-columns: 1.4fr 1fr 1.2fr; gap: 0; }
    .page-planner .sheet-box { padding: 0 16px; border: 0; border-left: 1px solid var(--line); border-radius: 0; background: transparent; gap: 8px; min-width: 0; }
    .page-planner .sheet-box:first-child { padding-left: 0; border-left: 0; }
    .page-planner .sheet-box:last-child { padding-right: 0; }
    .page-planner .sheet-date .date-nav { gap: 3px; flex-wrap: wrap; }
    .page-planner .sheet-date .date-nav .icon { font-size: 9px; padding: 4px 2px; }
    .page-planner .sheet-date .date-nav strong { font-family: Georgia, serif; }
    .page-planner .sheet-total .goal { font-size: 11px; flex-wrap: wrap; }
    .page-planner .sheet-total .goal input { width: 55px; min-height: 26px; padding: 2px 6px; }
    .page-planner .progress .bar { height: 4px; background: #e9ede3; }
    .page-planner .progress .bar span { background: #81956f; }
    .page-planner .sheet-memo { padding: 14px 0; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; }
    .page-planner .sheet-memo input { min-height: 28px; font-size: 13px; padding: 2px 4px; background: transparent; }
    .page-planner .sheet-body { grid-template-columns: minmax(0, 1fr) 194px; gap: 24px; }
    .page-planner .contents { gap: 18px; }
    .page-planner .contents .empty { margin: 20px 0; font-size: 12px; line-height: 1.9; }
    .page-planner .contents-group { grid-template-columns: 62px 1fr; }
    .page-planner .contents-group .subject-name { font-size: 12px; }
    .page-planner .highlight { font-size: 13px; line-height: 1.9; }
    .page-planner .contents-group li { border-color: var(--line); }
    .page-planner .mark { width: 23px; height: 23px; border: 1px solid #c3cbb9; border-radius: 3px; color: var(--leaf); font: 12px var(--font-body); }
    .page-planner .contents-group li.done .mark { border-color: var(--leaf); }
    .page-planner .tt-grid { border: 1px solid #b8c1ab; border-radius: 2px; }
    .page-planner .tt-row { border-color: #e2e6d9; }
    .page-planner .tt-cell { border-color: #e2e6d9; }
    .page-planner .tt-hour { color: #7b836f; border-color: #c7cebd; font-size: 10px; }
    .page-planner .tt-actual { background: #58714c; }
    .page-planner .tt-brush { border-width: 1px; border-radius: 3px; font-size: 11px; }
    .page-planner .planner { padding: 22px; }
    .page-planner .planner-head { flex-wrap: wrap; gap: 8px; }
    .page-planner .planner-head h2 { font-size: 15px; }
    .page-planner .planner-head small { font-size: 10px; }
    .page-planner .subjects { gap: 16px; }
    .page-planner .subjects > .empty { font-size: 12px; padding: 18px 0; }
    .page-planner .subject { border-width: 1px; border-left-width: 3px; border-radius: 3px; background: #fffefa; }
    .page-planner .subject-toggle { font-size: 13px; }
    .page-planner .subject-toggle small { font-size: 10px; }
    .page-planner .task { padding: 7px 0; border-radius: 0; font-size: 12px; background: transparent; }
    .page-planner .task input[type='checkbox'] { width: 15px; height: 15px; min-height: auto; }
    .page-planner .chip-btn { padding: 3px 7px; border-width: 1px; border-radius: 3px; font-size: 10px; }
    .page-planner .chip-btn.on { background: #edf0e7; }
    .page-planner .subject-body form input { min-width: 0; font-size: 12px; }
    .page-planner .add-subject { border-top: 1px solid var(--line); padding-top: 18px; gap: 14px; }
    .page-planner .add-subject input { font-size: 12px; }
    .page-planner .swatches { padding: 2px; gap: 8px; }
    .page-planner .swatch { width: 19px; height: 19px; border-width: 2px; }
    .page-planner .swatch.on { box-shadow: 0 0 0 2px var(--ink); }

    /* 캐릭터 미리보기의 3D 코드와 무대는 유지한다. */
    .page-character .character-layout { gap: 24px; }
    .page-character .character-layout > * { min-width: 0; }
    .page-character .preview-stage { min-width: 0; width: 100%; }
    .page-character .preview-info { gap: 10px; padding-top: 8px; }
    .page-character .preview-info .row { margin-top: 6px; }
    .page-character .char-grid.big { gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .page-character .char { border-width: 1px; border-radius: 4px; gap: 10px; }
    .page-character .char.on { background: #edf0e7; border-color: #81937a; }
    .page-character .char-grid.big .char { padding: 24px 8px 16px; }
    .page-character .char .badge { top: 5px; right: 5px; font-size: 9px; background: var(--leaf); color: white; }
    .page-character .char-grid.big .avatar.big { width: 48px; height: 48px; font-size: 27px; }

    @media (max-width: 1080px) {
      .auth-page { column-gap: 56px; }
      .app-header { gap: 20px; }
      .app-header .header-right { gap: 12px; }
      .page .room-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .page-planner .planner-grid { grid-template-columns: minmax(0, 1fr) 280px; gap: 18px; }
      .page-planner .sheet-body { grid-template-columns: 1fr; }
      .page-planner .timetable { max-width: 280px; }
    }
    @media (max-width: 860px) {
      .app-header { grid-template-columns: 1fr auto; min-height: 68px; padding: 14px 24px 0; gap: 12px; }
      .app-header .nav-tabs { height: 46px; grid-row: 2; grid-column: 1 / -1; justify-self: start; }
      .app-header .today-chip { display: none; }
      .page { padding-top: 32px; }
      .page-actions, .code-join { width: auto; }
      .page-planner .planner-grid { grid-template-columns: 1fr; }
      .page-planner .sheet-body { grid-template-columns: minmax(0, 1fr) 220px; }
      .page-planner .timetable { max-width: none; }
      .page-character .character-layout { grid-template-columns: 1fr; }
      .auth-page { grid-template-columns: minmax(0, 1fr) 340px; column-gap: 32px; }
      .auth-page .auth-card { padding: 26px; }
      .auth-description br { display: none; }
    }
    @media (max-width: 640px) {
      .auth-page { grid-template-columns: 1fr; gap: 30px; padding: 24px 24px 48px; }
      .auth-hero { padding: 0; }
      .auth-hero h1 { font-size: 30px; }
      .auth-hero .auth-description { margin: 16px 0 0; }
      .auth-hero .hero-points { display: none; }
      .auth-page .auth-card { padding: 24px; }
      .app-header { padding-inline: 20px; }
      .app-header .logo.small { font-size: 21px; }
      .app-header .profile-btn strong { max-width: 60px; }
      .page { padding: 28px 20px 40px; gap: 22px; }
      .page-head { padding-bottom: 24px; gap: 16px; }
      .page-head h1 { font-size: 29px; }
      .page-head p { font-size: 12px; }
      .page-head .btn { padding: 9px 12px; }
      .rooms-toolbar { flex-wrap: wrap; gap: 16px; }
      .rooms-toolbar .page-actions, .page .code-join { width: 100%; }
      .page .code-input { flex: 1; width: 80px; min-width: 0; }
      .code-join label { font-size: 11px; white-space: nowrap; }
      .page .room-grid { grid-template-columns: 1fr; gap: 14px; }
      .page .room-card { padding: 22px; }
      .rooms-note { align-items: flex-start; flex-direction: column; gap: 8px; }
      .page-planner .week { padding: 16px 10px; gap: 14px; align-items: stretch; }
      .page-planner .week > .sheet-label { padding-left: 6px; }
      .page-planner .week-bars { gap: 2px; }
      .page-planner .week-day { padding-inline: 0; }
      .page-planner .week-day small { font-size: 9px; }
      .page-planner .sheet { padding: 18px; gap: 20px; }
      .page-planner .sheet-top { grid-template-columns: 1fr 1fr; row-gap: 20px; }
      .page-planner .sheet-date { grid-column: 1 / -1; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
      .page-planner .sheet-dday { border-left: 0; padding-left: 0; }
      .page-planner .sheet-total { padding-left: 18px; }
      .page-planner .sheet-body { grid-template-columns: 1fr; }
      .page-planner .sheet-memo { flex-wrap: wrap; gap: 4px; }
      .page-planner .sheet-memo input { width: 100%; }
      .page-character .card { padding: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      :is(.auth-page, .app-header, .page) * { transition: none !important; }
    }
