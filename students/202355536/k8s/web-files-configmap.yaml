    .page-head h1 { font-size: 2rem; }
    .page-head p { margin: 4px 0 0; color: var(--muted); }
    .page-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .row.end { justify-content: flex-end; }

    /* ---------- 공부방 목록 ---------- */
