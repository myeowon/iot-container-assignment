# 자동 생성 파일 — src/web/ 를 수정한 뒤 scripts/gen_configmaps.py 로 다시 생성
apiVersion: v1
kind: ConfigMap
metadata:
  name: studyroom-web-files
  labels:
    app: studyroom
    component: web
data:
  api.js: |
    // 서버 API 호출 래퍼: JSON 송수신, 실패 응답은 서버 메시지를 담은 Error로 변환

    async function request(method, path, body) {
      const res = await fetch(`/api${path}`, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined,
        keepalive: method !== 'GET',
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || `요청에 실패했어요 (${res.status})`);
        err.status = res.status;
        throw err;
      }
      return data;
    }

    export const get = (path) => request('GET', path);
    export const post = (path, body = {}) => request('POST', path, body);
    export const put = (path, body) => request('PUT', path, body);
    export const patch = (path, body) => request('PATCH', path, body);
    export const del = (path) => request('DELETE', path);
  app.js: |
    // 앱 진입점: 로그인 확인 후 해시 라우팅 (#/login, #/rooms, #/planner, #/character, #/room/{id})
    import { get, post } from './api.js';
    import { mountAuth } from './auth-view.js';
    import { mountCharacterPage } from './character-page.js';
    import { mountPlannerPage } from './planner-page.js';
    import { mountRooms } from './rooms-view.js';

    // 공부방(Three.js·블룸 애드온 등 CDN 모듈)은 들어갈 때만 불러온다.
    // 정적으로 import하면 그 모듈을 다 받을 때까지 로그인 화면조차 뜨지 않는다.
    const loadRoom = () => import('./room-view.js');

    const root = document.getElementById('app');
    let unmount = null;
    let renderId = 0;     // 공부방 모듈을 받는 동안 다른 화면으로 이동했는지 확인용

    const ctx = {
      user: null,
      go: (hash) => { location.hash = hash; },
      onLogin(user) {
        ctx.user = user;
        ctx.go('#/rooms');
      },
      async logout() {
        await post('/auth/logout').catch(() => {});
        ctx.user = null;
        ctx.go('#/login');
      },
    };

    const PAGES = { rooms: mountRooms, planner: mountPlannerPage, character: mountCharacterPage };

    async function render() {
      const current = ++renderId;
      unmount?.();
      unmount = null;
      root.replaceChildren();

      const [, view, id] = location.hash.split('/');
      if (!ctx.user && view !== 'login') return ctx.go('#/login');
      if (ctx.user && view === 'login') return ctx.go('#/rooms');

      if (view === 'login') unmount = mountAuth(root, ctx);
      else if (PAGES[view]) {
        unmount = PAGES[view](root, ctx);
        loadRoom();   // 목록·플래너를 보는 동안 공부방 모듈을 미리 받아 둔다
      } else if (view === 'room' && id) {
        root.textContent = '공부방을 불러오는 중…';
        const { mountRoom } = await loadRoom();
        if (current !== renderId) return;
        root.replaceChildren();
        unmount = mountRoom(root, ctx, id);
      } else ctx.go('#/rooms');
    }

    try {
      ctx.user = (await get('/me')).user;
    } catch {
      ctx.user = null;
    }
    addEventListener('hashchange', render);
    render();
  auth-view.js: |
    // 로그인 / 간단 가입 화면 (캐릭터는 가입 시 랜덤, 로그인 후 상단에서 바꾼다)
    import { post } from './api.js';
    import { h, toast } from './ui.js';

    export function mountAuth(root, ctx) {
      let mode = 'login';
      const card = h('section', { class: 'card auth-card' });

      root.append(h('main', { class: 'auth-page' },
        h('a', { class: 'logo auth-brand', href: '#/login', 'aria-label': 'StudyPals 홈' },
          h('span', { class: 'brand-mark', 'aria-hidden': 'true' }, 's'), 'StudyPals'),
        h('div', { class: 'auth-hero' },
          h('span', { class: 'eyebrow' }, '나의 온라인 도서관'),
          h('h1', {}, '오늘 공부도', h('br'), '여기서 시작해요.'),
          h('p', { class: 'auth-description' }, '조용한 도서관에 자리를 잡고, 오늘 할 일을 펼쳐보세요.',
            h('br'), '같이 공부할 친구들이 기다리고 있어요.'),
          h('ol', { class: 'hero-points' },
            h('li', {}, h('span', {}, '01'), h('div', {}, h('strong', {}, '함께 앉는 공부방'), h('p', {}, '내 캐릭터로 입장하는 작은 3D 도서관'))),
            h('li', {}, h('span', {}, '02'), h('div', {}, h('strong', {}, '차곡차곡 쌓이는 시간'), h('p', {}, '공부한 시간과 하루의 기록을 한곳에'))),
            h('li', {}, h('span', {}, '03'), h('div', {}, h('strong', {}, '나만의 공부 계획'), h('p', {}, '과목별 할 일부터 10분 단위 시간표까지'))))),
        card));

      const field = (label, input) => h('label', { class: 'field' }, h('span', {}, label), input);

      function draw() {
        const signup = mode === 'signup';
        const tab = (m, label) => h('button', {
          type: 'button', class: `tab${mode === m ? ' on' : ''}`, 'aria-pressed': String(mode === m),
          onClick: () => { mode = m; draw(); },
        }, label);
        card.replaceChildren(
          h('div', { class: 'auth-card-heading' }, h('h2', {}, signup ? '첫 공부를 시작해볼까요?' : '다시 만나서 반가워요.'),
            h('p', {}, signup ? '간단한 가입으로 내 자리를 만들어보세요.' : '로그인하고 오늘의 공부를 이어가세요.')),
          h('div', { class: 'tabs' }, tab('login', '로그인'), tab('signup', '가입하기')),
          h('form', { class: 'stack', onSubmit: submit },
            field('아이디', h('input', { name: 'username', required: true, autocomplete: 'username',
              placeholder: '영문 소문자·숫자 3~20자', pattern: '[a-z0-9]{3,20}' })),
            field('비밀번호', h('input', { name: 'password', type: 'password', required: true, minLength: 6, maxLength: 72,
              placeholder: '6자 이상 입력',
              autocomplete: signup ? 'new-password' : 'current-password' })),
            signup && field('닉네임', h('input', { name: 'name', required: true, maxLength: 12, placeholder: '방에서 보일 이름' })),
            signup && h('small', {}, '캐릭터는 가입 후 캐릭터 메뉴에서 바꿀 수 있어요.'),
            h('button', { class: 'btn primary', type: 'submit' }, signup ? '가입하고 시작하기' : '로그인')));
      }

      async function submit(e) {
        e.preventDefault();
        const button = e.target.querySelector('[type="submit"]');
        button.disabled = true;
        try {
          const path = mode === 'signup' ? '/auth/signup' : '/auth/login';
          const { user } = await post(path, Object.fromEntries(new FormData(e.target)));
          ctx.onLogin(user);
        } catch (err) {
          toast(err.message);
        } finally {
          button.disabled = false;
        }
      }

      draw();
    }
  base.css: |
    /* 공통: 색 토큰, 기본 요소, 버튼·입력·카드 같은 컴포넌트 */
    :root {
      --bg: #fbf4e6;
      --paper: #fffdf7;
      --ink: #4a3f35;
      --muted: #8c7d6c;
      --line: #eadcc4;
      --leaf: #7fb069;
      --leaf-dark: #5a8f4e;
      --peach: #f4a261;
      --sky: #cfe8f3;
      --radius: 18px;
      --shadow: 0 6px 0 #e6d6bb, 0 10px 24px rgba(120, 95, 60, 0.12);
      --font-title: 'Jua', system-ui, sans-serif;
      --font-body: 'Gowun Dodum', system-ui, sans-serif;
      --font-hand: 'Gaegu', 'Gowun Dodum', system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(circle at 20% 0%, #fff7e8 0, var(--bg) 55%) fixed;
      color: var(--ink);
      font: 15px/1.5 var(--font-body);
    }
    h1, h2, h3 { font-family: var(--font-title); font-weight: 400; margin: 0; }
    h2 { font-size: 1.35rem; }
    h3 { font-size: 1.05rem; }
    small { color: var(--muted); }
    button, input, select { font: inherit; color: inherit; }

    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #fff;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--leaf); }
    input[type='checkbox'] { width: 18px; height: 18px; accent-color: var(--leaf-dark); flex: none; }
    input[type='range'] { width: 90px; padding: 0; border: 0; accent-color: var(--leaf-dark); }

    .btn {
      padding: 10px 18px;
      border: 0;
      border-radius: 999px;
      background: #f1e6d2;
      font-family: var(--font-title);
      cursor: pointer;
      box-shadow: 0 3px 0 #dccaa9;
      transition: transform 0.1s;
      white-space: nowrap;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #dccaa9; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary { background: var(--leaf); color: #fff; box-shadow: 0 3px 0 var(--leaf-dark); }
    .btn.ghost { background: transparent; box-shadow: none; border: 2px solid var(--line); }
    .btn.small { padding: 6px 12px; font-size: 0.9rem; }
    .icon { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 6px; border-radius: 8px; }
    .icon:hover { background: #f4ead8; }

    .card {
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .row.between { justify-content: space-between; }
    .empty { color: var(--muted); text-align: center; margin: 8px 0; }
    .label { color: var(--muted); min-width: 36px; }

    .chip, .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 12px;
      border-radius: 999px;
      background: #f4ead8;
      font-family: var(--font-title);
      font-size: 0.9rem;
      border: 0;
    }
    .badge.private { background: #ffe1d1; cursor: pointer; }
    .chip-btn {
      border: 2px solid var(--line); background: #fff; border-radius: 999px;
      padding: 2px 10px; font-size: 0.8rem; cursor: pointer; white-space: nowrap;
    }
    .chip-btn.on { background: #e7f3df; border-color: var(--leaf); color: var(--leaf-dark); }

    .seg {
      border: 2px solid var(--line); background: #fff; border-radius: 999px;
      padding: 6px 14px; cursor: pointer; font-family: var(--font-title);
    }
    .seg.on { background: var(--leaf); border-color: var(--leaf); color: #fff; }

    .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
    .swatch {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--c); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); cursor: pointer;
    }
    .swatch.on { box-shadow: 0 0 0 3px var(--ink); }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }

    .logo { font-family: var(--font-title); font-size: 3rem; color: var(--leaf-dark); letter-spacing: 2px; }
    .logo.small { font-size: 1.6rem; }

    #toast {
      position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
      background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px;
      opacity: 0; pointer-events: none; transition: 0.25s; z-index: 100; max-width: calc(100% - 32px);
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
  character-page.js: |
    // 캐릭터 페이지: 고르면 3D 미리보기에 보여 주고, 저장해야 실제로 바뀐다
    import { patch } from './api.js';
    import { mountShell } from './shell.js';
    import { CHARACTERS, characterOf, fill, h, toast } from './ui.js';

    const CHARACTER_IDS = Object.keys(CHARACTERS);

    export function mountCharacterPage(root, ctx) {
      const shell = mountShell(root, ctx, 'character');
      const stage = h('div', { class: 'preview-stage' }, h('p', { class: 'empty' }, '미리보기를 불러오는 중…'));
      const info = h('div', { class: 'preview-info' });
      const grid = h('div', { class: 'char-grid big' });
      let picked = ctx.user.character;
      let preview = null;
      let closed = false;

      shell.main.append(
        h('div', { class: 'page-head' },
          h('div', {}, h('span', { class: 'eyebrow' }, '공부방 속 나의 모습'), h('h1', {}, '캐릭터'),
            h('p', {}, '함께 공부할 친구를 고르고 저장해주세요.'))),
        h('div', { class: 'character-layout' },
          h('section', { class: 'card preview-card' }, stage, info),
          h('section', { class: 'card stack' }, h('h2', {}, '내 캐릭터 고르기'), grid)));

      function draw() {
        const current = ctx.user.character;
        const look = characterOf(picked);
        fill(info,
          h('h2', {}, `${look.emoji} ${look.label}`),
          h('small', {}, picked === current ? '지금 쓰고 있는 캐릭터예요' : '미리보기 중이에요 · 저장하면 바뀌어요'),
          h('div', { class: 'row' },
            h('button', { class: 'btn ghost', onClick: random }, '랜덤 선택'),
            h('button', { class: 'btn primary', disabled: picked === current, onClick: save }, '이 캐릭터로 저장')));
        grid.replaceChildren(...CHARACTER_IDS.map((id) => {
          const c = CHARACTERS[id];
          return h('button', { class: `char${id === picked ? ' on' : ''}`, 'aria-pressed': String(id === picked), onClick: () => pick(id) },
            h('span', { class: 'avatar big', style: `--c:${c.color}` }, c.emoji),
            h('small', {}, c.label),
            id === current && h('span', { class: 'badge' }, '사용 중'));
        }));
      }

      function pick(id) {
        picked = id;
        preview?.show(id);
        draw();
      }

      function random() {
        const others = CHARACTER_IDS.filter((id) => id !== picked);
        pick(others[Math.floor(Math.random() * others.length)]);
      }

      async function save() {
        try {
          ctx.user = (await patch('/me', { character: picked })).user;
          shell.refreshProfile();
          toast(`${characterOf(picked).label}(으)로 저장했어요`);
          draw();
        } catch (err) {
          toast(err.message);
        }
      }

      // 3D 미리보기(Three.js)는 공부방처럼 필요할 때만 불러온다
      import('./character-preview.js').then(({ createPreview }) => {
        if (closed) return;
        stage.replaceChildren();
        preview = createPreview(stage);
        preview.show(picked);
      }).catch(() => fill(stage, h('p', { class: 'empty' }, '3D 미리보기를 불러오지 못했어요')));

      draw();
      return () => {
        closed = true;
        preview?.destroy();
        shell.destroy();
      };
    }
  character-preview.js: |
    // 캐릭터 페이지의 3D 미리보기: 방석 위에 앉아 손을 흔들며 천천히 좌우로 돈다
    import * as THREE from 'three';
    import { createCharacter } from './characters.js';
    import { cyl } from './mesh.js';

    export function createPreview(container) {
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.shadowMap.enabled = true;
      container.append(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
      camera.position.set(0, 2.2, 6.2);
      camera.lookAt(0, 1.05, 0);

      const sun = new THREE.DirectionalLight('#fff3e0', 2.2);
      sun.position.set(3, 6, 4);
      sun.castShadow = true;
      scene.add(new THREE.HemisphereLight('#ffffff', '#c9b38f', 1.6), sun);

      const cushion = cyl(0.62, 0.66, 0.16, '#7fb069', [0, 0.42, 0], 32);   // 앉을 방석
      const floor = cyl(1.5, 1.5, 0.08, '#f1e6d2', [0, 0.04, 0], 48);
      scene.add(floor, cushion);

      let character = null;
      const clock = new THREE.Clock();

      function resize() {
        const { clientWidth: w, clientHeight: h } = container;
        camera.aspect = w / h || 1;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
      const observer = new ResizeObserver(resize);
      observer.observe(container);

      renderer.setAnimationLoop(() => {
        const dt = clock.getDelta();
        const t = clock.elapsedTime;
        if (character) {
          character.root.rotation.y = Math.sin(t * 0.5) * 0.7;
          character.tick(t, dt);
        }
        renderer.render(scene, camera);
      });

      return {
        /** 캐릭터 id를 바꿔 보여 준다 */
        show(characterId) {
          if (character) scene.remove(character.root);
          character = createCharacter({ id: 'preview', character: characterId }, { withProps: false });
          character.setPose('HELLO');
          scene.add(character.root);
        },
        destroy() {
          renderer.setAnimationLoop(null);
          observer.disconnect();
          scene.traverse((o) => o.geometry?.dispose());
          renderer.dispose();
          renderer.domElement.remove();
        },
      };
    }
  character-props.js: |
    // 캐릭터 자리의 개인 소품: 펼친 책·커피·책 더미(오늘 남은 할 일), 손에 드는 휴대폰
    import * as THREE from 'three';
    import { DESK, book, coffeeMug, openBook } from './furniture.js';
    import { box, glow } from './mesh.js';

    const BOOK_THICKNESS = 0.1;

    export function deskProps() {
      const reading = openBook();
      reading.object.position.set(-0.62, DESK.top + 0.01, DESK.near + 0.3);
      reading.object.rotation.y = 0.15;

      const mug = coffeeMug();
      mug.object.position.set(0.55, DESK.top, DESK.near + 0.28);

      const stack = new THREE.Group();
      stack.position.set(0.72, DESK.top + BOOK_THICKNESS / 2, DESK.far - 0.35);
      return { reading, mug, stack };
    }

    export function phone() {
      const g = new THREE.Group();
      g.add(box(0.15, 0.26, 0.03, '#2b2d42'), box(0.12, 0.21, 0.005, glow('#9ad1ff', 1.5), [0, 0, 0.018]));
      g.position.set(0, -0.48, 0.08);
      g.rotation.x = -0.3;
      return g;
    }

    /** 남은 할 일의 과목 색대로 책을 살짝 엇갈리게 쌓는다 */
    export function stackBooks(stack, colors) {
      stack.clear();
      colors.forEach((c, i) => {
        const b = book(c, 0.56, BOOK_THICKNESS, 0.42);
        b.position.y = i * (BOOK_THICKNESS + 0.004);
        b.rotation.y = i % 2 ? 0.12 : -0.1;
        stack.add(b);
      });
    }
  characters.js: |
    // 치비 동물 캐릭터(곰·토끼·고양이·강아지)와 상태별 포즈·소품
    import * as THREE from 'three';
    import { deskProps, phone, stackBooks } from './character-props.js';
    import { capsule, plush, sphere } from './mesh.js';
    import { STATUS, characterOf, fill, h } from './ui.js';

    const SHIRTS = ['#7fa7c9', '#d98a7a', '#8fb380', '#a993c4', '#d9b25f', '#6fb0b8'];
    const INK = '#2b211c';
    const BLUSH = '#ff9fa0';
    const PINK_NOSE = '#f29aa5';
    const HEAD_SCALE = 0.85;   // 몸에 비해 머리 크기 (귀·얼굴 포함)
    const DOG_EAR = '#94592b';

    // 캐릭터별 얼굴: 주둥이 색, 코 색, snout(주둥이 길이 배율), iris(눈동자 뒤 홍채), tongue(혀)
    const FACE = {
      bear: { muzzle: '#fff1de', nose: INK },
      rabbit: { muzzle: '#fff1de', nose: PINK_NOSE },
      'cat-white': { muzzle: '#fff1de', nose: PINK_NOSE },
      'cat-black': { muzzle: '#3d393b', nose: PINK_NOSE, iris: '#e8c547' },   // 검은 털에 눈이 묻히지 않게
      dog: { muzzle: '#e3b67f', nose: INK, snout: 1.3, tongue: true },
    };

    function ears(animal, fur) {
      const g = new THREE.Group();
      for (const side of [-1, 1]) {
        if (animal === 'bear') {
          g.add(sphere(0.17, fur, [side * 0.36, 0.84, 0]), sphere(0.09, plush(BLUSH), [side * 0.36, 0.84, 0.09], [1, 1, 0.5]));
        } else if (animal === 'cat') {
          for (const [r, len, z, m] of [[0.23, 0.44, 0, fur], [0.13, 0.28, 0.07, plush(BLUSH)]]) {
            const ear = new THREE.Mesh(new THREE.ConeGeometry(r, len, 4), m);
            ear.position.set(side * 0.31, 0.92 - (0.44 - len) / 2, z);
            ear.rotation.z = -side * 0.35;
            g.add(ear);
          }
        } else if (animal === 'dog') {
          // 리트리버처럼 머리 옆으로 축 늘어진 귀
          const ear = sphere(0.21, plush(DOG_EAR), [side * 0.5, 0.4, -0.02], [0.5, 1.2, 0.85]);
          ear.rotation.z = side * 0.25;
          g.add(ear);
        } else {
          for (const [r, len, z, m] of [[0.1, 0.5, -0.02, fur], [0.05, 0.38, 0.07, plush(BLUSH)]]) {
            const ear = capsule(r, len, m, [side * 0.17, 1.1, z]);
            ear.rotation.z = -side * 0.14;
            g.add(ear);
          }
        }
      }
      return g;
    }

    function head(characterId, animal, fur) {
      const face = FACE[characterId];
      const snout = face.snout ?? 1;
      const g = new THREE.Group();
      g.add(
        sphere(0.52, fur, [0, 0.42, 0], [1.06, 0.95, 1]),
        sphere(0.06, INK, [-0.17, 0.46, 0.46]), sphere(0.06, INK, [0.17, 0.46, 0.46]),
        sphere(0.02, '#ffffff', [-0.15, 0.49, 0.51]), sphere(0.02, '#ffffff', [0.19, 0.49, 0.51]),
        sphere(0.08, plush(BLUSH), [-0.31, 0.33, 0.4], [1, 0.6, 0.4]), sphere(0.08, plush(BLUSH), [0.31, 0.33, 0.4], [1, 0.6, 0.4]),
        sphere(0.17, plush(face.muzzle), [0, 0.3, 0.43 + (snout - 1) * 0.15], [1.2, 0.8, 0.7 * snout]),
        sphere(0.05 * snout, face.nose, [0, 0.36, 0.56 + (snout - 1) * 0.3]),
        ears(animal, fur),
      );
      if (face.iris) g.add(sphere(0.085, face.iris, [-0.17, 0.46, 0.43]), sphere(0.085, face.iris, [0.17, 0.46, 0.43]));
      if (face.tongue) g.add(sphere(0.05, '#f08a96', [0, 0.17, 0.58], [1, 0.5, 0.6]));
      return g;
    }

    /** 캐릭터를 새로 만들어야 하는지 판단하는 키 (사람과 캐릭터가 같으면 재사용) */
    export const characterKey = (m) => `${m.id}:${m.character}`;

    /** 어깨를 축으로 회전하는 팔. rotation.x < 0 이면 앞으로 든다. */
    function arm(side, shirt, fur) {
      const pivot = new THREE.Group();
      pivot.position.set(side * 0.36, 0.65, 0);
      pivot.add(capsule(0.1, 0.3, shirt, [0, -0.2, 0]), sphere(0.1, fur, [0, -0.42, 0]));
      return pivot;
    }

    // 상태별 목표 각도 (t: 경과 시간[s])
    // 팔 rotation.z: +x쪽 팔(right)은 음수일수록, -x쪽 팔(left)은 양수일수록 몸 안쪽으로 모인다
    const POSES = {
      STUDYING: (t) => ({ lean: 0.1, headX: 0.22 + Math.sin(t * 1.3) * 0.03, headY: Math.sin(t * 0.4) * 0.06,
        rightX: -1.15 + Math.sin(t * 13) * 0.05, rightZ: -0.25, leftX: -1.15 + Math.cos(t * 11) * 0.05, leftZ: 0.25 }),
      AWAY: (t) => ({ lean: 0, headX: 0.32, headY: Math.sin(t * 0.7) * 0.1,
        rightX: -1.75, rightZ: -0.35, leftX: -0.5, leftZ: 0 }),
      BREAK: (t) => ({ lean: -0.08, headX: -0.18, headY: 0,
        rightX: 0, rightZ: 2.4 + Math.sin(t * 1.4) * 0.3, leftX: 0, leftZ: -2.4 - Math.sin(t * 1.4) * 0.3 }),
      IDLE: () => ({ lean: 0.35, headX: 0.65, headY: 0.25,
        rightX: -1.35, rightZ: -0.5, leftX: -1.35, leftZ: 0.5 }),
      // 캐릭터 페이지 미리보기: 한 손을 들어 흔든다
      HELLO: (t) => ({ lean: 0, headX: -0.05, headY: Math.sin(t * 1.2) * 0.15,
        rightX: 0, rightZ: 2.5 + Math.sin(t * 7) * 0.25, leftX: -0.3, leftZ: 0.1 }),
    };

    /** withProps: 책상 위 개인 소품(펼친 책·커피·책 더미)까지 그릴지 — 캐릭터 페이지 미리보기는 false */
    export function createCharacter(member, { withProps = true } = {}) {
      const shirt = plush(SHIRTS[[...member.id].reduce((a, c) => a + c.charCodeAt(0), 0) % SHIRTS.length]);
      const id = member.character in FACE ? member.character : 'bear';   // 모르는 캐릭터면 곰
      const look = characterOf(id);
      const fur = plush(look.color);
      const root = new THREE.Group();
      const upper = new THREE.Group();          // 허리를 축으로 기울어지는 상체
      upper.position.y = 0.55;
      const headPivot = new THREE.Group();
      headPivot.position.y = 0.8;
      const headModel = head(id, look.animal, fur);
      headModel.scale.setScalar(HEAD_SCALE);
      headPivot.add(headModel);
      const right = arm(1, shirt, fur);
      const left = arm(-1, shirt, fur);
      upper.add(capsule(0.3, 0.25, shirt, [0, 0.42, 0]), headPivot, right, left);

      const legs = [-1, 1].map((side) => {
        const leg = capsule(0.11, 0.3, plush('#5c6470'), [side * 0.14, 0.6, 0.22]);
        leg.rotation.x = Math.PI / 2;
        return leg;
      });
      const props = deskProps();
      const handPhone = phone();
      handPhone.visible = false;   // 자리 비움(AWAY) 상태에서만 보인다
      right.add(handPhone);
      const labelAnchor = new THREE.Object3D();
      labelAnchor.position.y = 2.4;
      root.add(upper, ...legs, labelAnchor);
      if (withProps) root.add(props.reading.object, props.mug.object, props.stack);

      // 이름표는 HTML로 그린다 (블룸 효과에 번지지 않고 글자가 선명하다)
      const label = h('div', { class: 'name-tag' });
      let status = null;
      let books = '';
      let labelKey = '';
      const pose = { ...POSES.IDLE(0) };

      /** 이름표: 1줄 상태+이름, 2줄 지금 시각에 계획된 과목·할 일 (플래너 시간표) */
      function drawLabel(m) {
        const plan = m.plan && `${m.plan.name}${m.plan.task ? ` · ${m.plan.task}` : ''}`;
        const key = `${status}|${m.name}|${plan}`;
        if (key === labelKey) return;
        labelKey = key;
        fill(label,
          h('span', {}, `${STATUS[status].emoji} ${m.name}`),
          plan && h('small', { class: 'plan', style: `--c:${m.plan.color}` }, h('i', { class: 'dot' }), plan));
      }

      function setBooks(colors) {
        const key = colors.join();
        if (key === books) return;
        books = key;
        stackBooks(props.stack, colors);
      }

      return {
        root,
        label,
        labelAnchor,
        key: characterKey(member),
        get status() { return status; },
        /** 이름표·소품 없이 포즈만 정한다 (캐릭터 페이지 미리보기) */
        setPose(name) { status = name; },
        update(m, isMe) {
          status = m.status;
          props.reading.object.visible = status === 'STUDYING';
          props.reading.setColor(m.subjectColor || '#e76f51');
          handPhone.visible = status === 'AWAY';
          setBooks(m.books || []);
          label.className = `name-tag ${status}${isMe ? ' me' : ''}`;
          drawLabel(m);
        },
        tick(t, dt) {
          const target = POSES[status || 'IDLE'](t);
          const k = Math.min(1, dt * 6);
          for (const key in target) pose[key] += (target[key] - pose[key]) * k;
          props.mug.tick(t);
          upper.rotation.x = pose.lean;
          upper.scale.y = 1 + Math.sin(t * 2) * 0.012;
          headPivot.rotation.set(pose.headX, pose.headY, 0);
          right.rotation.set(pose.rightX, 0, pose.rightZ);
          left.rotation.set(pose.leftX, 0, pose.leftZ);
        },
        dispose() {
          label.remove();
        },
      };
    }
  daylight.js: |
    // 실제 시각에 따른 하늘·빛 상태: 새벽 → 해돋이 → 낮 → 노을 → 밤
    // 키프레임 사이는 선형 보간해서 시간이 흐르면 자연스럽게 바뀐다.
    // 미리보기: 주소에 ?time=18:30 을 붙이면 그 시각으로 고정된다.
    import * as THREE from 'three';

    // [시각, 하늘 위, 지평선, 햇빛 색, 햇빛 세기, 주변광 세기, 실내 조명 비율, 별]
    // 실내 조명 비율이 0인 아침·낮(8시~16시)에는 책상 스탠드가 꺼진다
    const KEYS = [
      [0, '#0a0f24', '#1c2348', '#8fa6ff', 0.25, 0.45, 1.0, 1.0],
      [4.5, '#111735', '#3a2f5c', '#8fa6ff', 0.25, 0.5, 1.0, 0.8],
      [5.5, '#2b3a6b', '#d68fa0', '#ffb08a', 0.6, 0.75, 0.8, 0.25],
      [6.5, '#5b8bc9', '#ffb27a', '#ffb070', 1.6, 1.0, 0.3, 0],
      [8, '#4f9be6', '#cfe6f7', '#fff3e0', 2.8, 1.4, 0, 0],
      [16, '#4f9be6', '#d8ecf8', '#fff0d8', 2.6, 1.4, 0, 0],
      [17.5, '#6a7fc0', '#ffb36b', '#ffa860', 1.8, 1.1, 0.45, 0],
      [18.6, '#363b78', '#e2704a', '#ff7a40', 0.8, 0.8, 0.85, 0.1],
      [19.6, '#121836', '#2c2c5c', '#8fa6ff', 0.25, 0.5, 1.0, 0.8],
      [24, '#0a0f24', '#1c2348', '#8fa6ff', 0.25, 0.45, 1.0, 1.0],
    ];

    const NAMES = [[4.5, '🌌 밤'], [6, '🌄 새벽'], [7.5, '🌅 해돋이'], [17, '☀️ 낮'], [19, '🌇 노을'], [24, '🌙 밤']];

    export function currentHours() {
      const fixed = new URLSearchParams(location.search).get('time');
      const match = fixed?.match(/^(\d{1,2}):(\d{2})$/);
      if (match) return Number(match[1]) + Number(match[2]) / 60;
      const now = new Date();
      return now.getHours() + now.getMinutes() / 60;
    }

    const lerp = (a, b, t) => a + (b - a) * t;
    const mix = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), t);

    /** 시각(0~24) → 하늘·빛 상태 */
    export function daylightAt(hours) {
      const i = KEYS.findIndex((k, idx) => hours >= k[0] && hours < KEYS[idx + 1][0]);
      const [h0, top0, hor0, sun0, si0, amb0, lamp0, star0] = KEYS[i];
      const [h1, top1, hor1, sun1, si1, amb1, lamp1, star1] = KEYS[i + 1];
      const t = (hours - h0) / (h1 - h0);

      // 해는 5:30~19:00 동안 창 왼쪽에서 오른쪽으로 호를 그리며 지나간다. 나머지 시간엔 달.
      const isDay = hours >= 5.5 && hours < 19;
      const progress = isDay ? (hours - 5.5) / 13.5 : ((hours + 5) % 24) / 10.5;
      return {
        hours,
        name: NAMES.find(([end]) => hours < end)[1],
        skyTop: mix(top0, top1, t),
        horizon: mix(hor0, hor1, t),
        sunColor: mix(sun0, sun1, t),
        sunIntensity: lerp(si0, si1, t),
        ambient: lerp(amb0, amb1, t),
        lamp: lerp(lamp0, lamp1, t),
        stars: lerp(star0, star1, t),
        body: isDay ? 'sun' : 'moon',
        progress,                                   // 0(왼쪽) → 1(오른쪽)
        elevation: Math.sin(progress * Math.PI),    // 0(지평선) → 1(가장 높음)
      };
    }
  furniture.js: |
    // 책상과 책상 위 소품(스탠드·노트북·책·커피). 좌표는 각 물건의 바닥 중심 기준.
    import * as THREE from 'three';
    import { box, cyl, group, mat } from './mesh.js';
    import { codeScreen } from './textures.js';

    export const OAK = '#d6b48a';
    export const WHITE = '#f2f0eb';
    export const METAL = mat('#3a3a40', { metalness: 0.5, roughness: 0.5 });

    /**
     * 책상 치수. 캐릭터는 원점에 앉아 +z를 보고, 책상은 z = near ~ near + depth 에 놓인다.
     * top: 책상 윗면 높이 (소품을 올릴 기준)
     */
    export const DESK = { width: 2.4, depth: 1.25, height: 0.85, near: 0.3 };
    DESK.top = DESK.height + 0.035;
    DESK.far = DESK.near + DESK.depth;     // 좌석 원점 → 책상 앞 가장자리

    /** 흰 상판 + 원목 몸체 책상(오른쪽 서랍장, 서랍은 앉는 쪽) + 의자 */
    export function deskSet() {
      const { width: w, depth: d, height: h, near } = DESK;
      const midZ = near + d / 2;
      const cabinetX = w / 2 - 0.33;
      const drawers = [0.22, 0.46, 0.7].map((y) => box(0.48, 0.02, 0.01, '#b8936a', [cabinetX, y, near + 0.045]));
      const desk = group(
        box(w, 0.07, d, mat(WHITE, { roughness: 0.65 }), [0, h, midZ]),   // 무광에 가깝게 (스탠드 빛 반사로 하얗게 타지 않게)
        box(w - 0.1, 0.62, 0.04, OAK, [0, h - 0.36, DESK.far - 0.05]),                 // 앞판
        box(0.58, h - 0.06, d - 0.1, OAK, [cabinetX, (h - 0.06) / 2, midZ]),            // 서랍장
        box(0.05, h - 0.06, d - 0.1, OAK, [-w / 2 + 0.05, (h - 0.06) / 2, midZ]),       // 왼쪽 다리판
        ...drawers,
      );
      const legs = [[-0.24, -0.24], [0.24, -0.24], [-0.24, 0.24], [0.24, 0.24]]
        .map(([x, z]) => cyl(0.02, 0.02, 0.48, METAL, [x, 0.24, z], 6));
      const chair = group(
        box(0.56, 0.05, 0.54, '#c79a68', [0, 0.5, 0]),
        box(0.56, 0.36, 0.05, '#c79a68', [0, 0.86, -0.28]),
        cyl(0.02, 0.02, 0.4, METAL, [-0.24, 0.68, -0.27], 6),
        cyl(0.02, 0.02, 0.4, METAL, [0.24, 0.68, -0.27], 6),
        ...legs,
      );
      return group(desk, chair);
    }

    /** 노트북: 화면이 캐릭터(-z) 쪽을 본다. setOn으로 화면을 켜고 끈다. */
    export function laptop() {
      const screenMaterial = new THREE.MeshStandardMaterial({
        color: '#0d1018', emissive: '#ffffff', emissiveMap: codeScreen(), emissiveIntensity: 0.05,
      });
      const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.44, 0.27), screenMaterial);
      screen.rotation.y = Math.PI;
      screen.position.set(0, 0.16, -0.012);
      const lid = group(box(0.48, 0.32, 0.02, '#c5c8cf', [0, 0.16, 0]), screen);
      lid.position.z = 0.15;
      lid.rotation.x = 0.28;
      const object = group(box(0.48, 0.025, 0.32, '#c5c8cf', [0, 0.012, 0]), lid);
      return {
        object,
        setOn(on) {
          screenMaterial.emissiveIntensity = on ? 1.4 : 0.05;
        },
      };
    }

    /** 은행원 스탠드: 황동 몸체 + 빛나는 갓. setLevel(0~1)로 밝기 조절 (아침·낮에는 꺼지고 밤에는 밝게) */
    export function bankerLamp(shade) {
      const brass = mat('#b08d4a', { metalness: 0.6, roughness: 0.4 });
      const shadeMaterial = new THREE.MeshStandardMaterial({ color: shade, emissive: shade, emissiveIntensity: 1, roughness: 0.5 });
      const hood = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.4, 16, 1, false, 0, Math.PI), shadeMaterial);
      hood.rotation.z = Math.PI / 2;
      hood.position.set(0, 0.5, 0.06);
      // 책상 6~8개가 붙어 있어 빛이 겹치므로 한 개당 빛은 약하고 짧게
      const light = new THREE.PointLight('#ffb35c', 1, 2.4, 2);
      light.position.set(0, 0.4, 0.1);
      return {
        object: group(cyl(0.1, 0.12, 0.05, brass, [0, 0.025, 0], 16), cyl(0.016, 0.016, 0.46, brass, [0, 0.26, 0], 6), hood, light),
        /** level 0이면 완전히 꺼진다 (광원은 그대로 두고 세기만 0 — 광원 수가 바뀌면 셰이더를 다시 컴파일함) */
        setLevel(level) {
          light.intensity = level * 1.05;
          shadeMaterial.emissiveIntensity = level * 1.1;
        },
      };
    }

    /** 누워 있는 책: 앞·뒤 표지 + 책등 + 안쪽 종이 덩어리. 책등은 -x 쪽 */
    export function book(color, length = 0.46, thickness = 0.08, width = 0.34) {
      const cover = mat(color, { roughness: 0.6 });
      return group(
        box(length - 0.02, thickness - 0.02, width - 0.025, '#f3ecdc', [0.01, 0, 0]),
        box(length, 0.012, width, cover, [0, thickness / 2 - 0.006, 0]),
        box(length, 0.012, width, cover, [0, -thickness / 2 + 0.006, 0]),
        box(0.016, thickness, width, cover, [-length / 2 + 0.008, 0, 0]),
      );
    }

    /** 김이 나는 커피 머그. tick(t)를 매 프레임 호출하면 김이 피어오른다. */
    export function coffeeMug(color = '#f2ece2') {
      const height = 0.17;
      const handle = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.016, 8, 16), mat(color));
      handle.position.x = 0.095;
      const steam = Array.from({ length: 3 }, () => {
        const puff = new THREE.Mesh(
          new THREE.SphereGeometry(0.035, 10, 8),
          new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0, depthWrite: false }));
        return puff;
      });
      const object = group(
        cyl(0.085, 0.075, height, color, [0, height / 2, 0], 20),
        cyl(0.075, 0.075, 0.01, '#4a2c1a', [0, height - 0.012, 0], 20),   // 커피
        handle,
        ...steam,
      );
      handle.position.y = height / 2;
      return {
        object,
        tick(t) {
          steam.forEach((puff, i) => {
            const phase = (t * 0.45 + i / steam.length) % 1;       // 0 → 1 로 올라가며 사라진다
            puff.position.set(Math.sin(t * 2 + i) * 0.02, height + phase * 0.32, 0);
            puff.scale.setScalar(0.6 + phase);
            puff.material.opacity = Math.sin(phase * Math.PI) * 0.25;
          });
        },
      };
    }

    /** 펼친 책: 양쪽 페이지가 V자로 살짝 들려 있다. setColor로 표지 색을 바꾼다. */
    export function openBook() {
      const cover = new THREE.MeshStandardMaterial({ color: '#e76f51', roughness: 0.6 });
      const half = (side) => {
        const g = group(
          box(0.42, 0.014, 0.56, cover, [side * 0.21, 0, 0]),
          box(0.4, 0.04, 0.53, '#f6f0e2', [side * 0.21, 0.027, 0]),
        );
        g.rotation.z = side * 0.1;
        return g;
      };
      return { object: group(half(-1), half(1)), setColor: (c) => cover.color.set(c) };
    }
  index.html: |
