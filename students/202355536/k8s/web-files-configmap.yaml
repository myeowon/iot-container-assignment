    .room-card:hover { transform: translateY(-3px); border-color: var(--leaf); }
    .room-card h3 { font-size: 1.25rem; overflow-wrap: anywhere; }
    .room-card-top { display: flex; justify-content: space-between; align-items: center; }
    .room-icon { width: 44px; height: 44px; border-radius: 14px; background: #f4ead8; display: grid; place-items: center; font-size: 1.4rem; }
    .room-card-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; }
    .seats { display: flex; gap: 5px; flex-wrap: wrap; }
    .seats i { width: 16px; height: 16px; border-radius: 5px; background: #efe4d1; }
    .seats i.filled { background: var(--leaf); }
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .empty-state p { margin: 0 0 8px; color: var(--muted); }
    .empty-emoji { font-size: 2.6rem; }
    .room-dialog { width: min(440px, calc(100% - 32px)); padding: 24px; }
    .room-dialog::backdrop { background: rgba(74, 63, 53, 0.35); backdrop-filter: blur(2px); }

    /* ---------- 플래너 ---------- */
    .planner-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
    .planner { display: flex; flex-direction: column; gap: 16px; }
    .planner-head { display: flex; justify-content: space-between; align-items: baseline; }
    .today, .subjects { display: flex; flex-direction: column; gap: 8px; }
    .goal { display: flex; align-items: center; gap: 4px; color: var(--muted); }
    .goal input { width: 70px; padding: 4px 8px; }
    .progress .bar { height: 12px; border-radius: 999px; background: #f1e6d2; overflow: hidden; }
    .subject-times { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .progress .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--leaf), #a7d38e); transition: width 0.4s; }
    .tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .task { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: #fff; }
    .task .title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .task.done .title { text-decoration: line-through; color: var(--muted); }
    .subject { border: 2px solid var(--line); border-left: 6px solid var(--c); border-radius: 12px; background: #fffaf1; }
    .subject-head { display: flex; align-items: center; padding: 4px 6px; }
    .subject-toggle {
      flex: 1; display: flex; align-items: center; gap: 8px; border: 0; background: none;
      font-family: var(--font-title); cursor: pointer; text-align: left; padding: 6px;
    }
    .subject-toggle small { margin-left: auto; font-family: var(--font-body); }
    .subject-body { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 8px; }
    .subject-body form input { flex: 1; width: auto; }
    .add-subject { display: flex; flex-direction: column; gap: 8px; padding-top: 6px; border-top: 2px dashed var(--line); }
    .backlog select { flex: 1; width: auto; }

    /* ---------- 좁은 화면 ---------- */
    @media (max-width: 860px) {
      .auth-page, .planner-grid, .character-layout { grid-template-columns: 1fr; }
      .preview-stage { height: 300px; }
      .auth-page { gap: 16px; }
      .app-header { grid-template-columns: 1fr auto; }
