  auth.py: |
    """아이디+비밀번호 가입/로그인과 서명 쿠키 세션."""
    import hashlib
    import hmac
    import os
    import re
    import secrets

    from common import ApiError, db, new_id, now, rate_limited, text
    from study import study_today

    SESSION_SECRET = os.environ.get("SESSION_SECRET", "dev-only-secret").encode()
    COOKIE_SECURE = os.environ.get("COOKIE_SECURE", "1") == "1"
    SESSION_SECONDS = 30 * 24 * 3600
    PBKDF2_ROUNDS = 200_000
    CHARACTERS = ("bear", "rabbit", "cat-black", "cat-white", "dog")


    def hash_password(password, salt_hex):
        return hashlib.pbkdf2_hmac(
            "sha256", password.encode(), bytes.fromhex(salt_hex), PBKDF2_ROUNDS
        ).hex()


    def _sign(payload):
        return hmac.new(SESSION_SECRET, payload.encode(), hashlib.sha256).hexdigest()


    def sign_session(uid):
        payload = f"{uid}.{int(now()) + SESSION_SECONDS}"
        return f"{payload}.{_sign(payload)}"


    def verify_session(token):
        """쿠키 값 → uid. 서명이 틀리거나 만료됐으면 None."""
        try:
            payload, sig = token.rsplit(".", 1)
            uid, exp = payload.split(".")
            if hmac.compare_digest(sig, _sign(payload)) and int(exp) >= now():
                return uid
        except ValueError:
            pass
        return None


    def session_cookie(value, max_age):
        cookie = f"sid={value}; Path=/; HttpOnly; SameSite=Lax; Max-Age={max_age}"
        return cookie + ("; Secure" if COOKIE_SECURE else "")


    def character_of(u):
        """사용자의 캐릭터 id. 캐릭터 필드가 생기기 전 계정(animal 필드)도 비슷한 캐릭터로 바꿔 준다."""
        if u.get("character") in CHARACTERS:
            return u["character"]
        old = u.get("animal")
        return "cat-black" if old == "cat" else old if old in CHARACTERS else "bear"


    def public_user(uid, u):
        return {"id": uid, "username": u["username"], "name": u["name"], "character": character_of(u)}


    def signup(req):
        b = req.body
        username = str(b.get("username") or "").strip().lower()
        if not re.fullmatch(r"[a-z0-9]{3,20}", username):
            raise ApiError(400, "아이디는 영문 소문자·숫자 3~20자예요")
        password = str(b.get("password") or "")
        if not 6 <= len(password) <= 72:
            raise ApiError(400, "비밀번호는 6~72자로 입력해 주세요")
        name = text(b, "name", 1, 12, "닉네임")

        uid = "u" + new_id()
        # SET NX: 같은 아이디가 동시에 가입되는 것을 막는다
        if not db.set(f"username:{username}", uid, "NX"):
            raise ApiError(409, "이미 사용 중인 아이디예요")
        salt = secrets.token_hex(16)
        # 캐릭터는 가입할 때 랜덤으로 주고, 로그인 후 닉네임 옆에서 바꿀 수 있다
        user = {"username": username, "name": name, "character": secrets.choice(CHARACTERS),
                "pw_salt": salt, "pw_hash": hash_password(password, salt), "created": int(now())}
        db.hset(f"user:{uid}", user)
        req.login(uid)
        return {"user": public_user(uid, user)}


    def login(req):
        username = str(req.body.get("username") or "").strip().lower()
        password = str(req.body.get("password") or "")
        if rate_limited(f"rl:login:{username}", 10):
            raise ApiError(429, "로그인 시도가 너무 많아요. 1분 뒤 다시 시도해 주세요")
        uid = db.get(f"username:{username}") if username else None
        u = db.hgetall(f"user:{uid}") if uid else {}
        if not u or not hmac.compare_digest(hash_password(password, u["pw_salt"]), u["pw_hash"]):
            raise ApiError(401, "아이디 또는 비밀번호가 맞지 않아요")
        req.login(uid)
        return {"user": public_user(uid, u)}


    def logout(req):
        req.logout()
        return {"ok": True}


    def me(req):
        return {"user": public_user(req.uid, req.user), "today": study_today(req.uid)}


    def update_me(req):
        """캐릭터 바꾸기"""
        character = req.body.get("character")
        if character not in CHARACTERS:
            raise ApiError(400, "없는 캐릭터예요")
        db.hset(f"user:{req.uid}", {"character": character})
        req.user["character"] = character
        return {"user": public_user(req.uid, req.user)}
  common.py: |
    """모듈 공통: 설정값, Redis 연결, 에러 타입, 입력 검증 유틸."""
    import os
    import re
    import secrets
    import time
    from datetime import datetime, timedelta, timezone

    from redis_client import Redis

    KST = timezone(timedelta(hours=9))
    HEX_COLOR = re.compile(r"#[0-9a-fA-F]{6}")

    db = Redis(
        os.environ.get("REDIS_HOST", "localhost"),
        os.environ.get("REDIS_PORT", "6379"),
        os.environ.get("REDIS_PASSWORD") or None,
    )


    class ApiError(Exception):
        def __init__(self, status, message):
            super().__init__(message)
            self.status = status
            self.message = message


    def now():
        return time.time()


    def today():
        """공부시간·데일리 플래너의 날짜 기준 (서버 TZ와 무관하게 KST)."""
        return days_ago(0)


    def days_ago(n):
        return (datetime.now(KST) - timedelta(days=n)).strftime("%Y%m%d")


    def past_day(value):
        """YYYYMMDD 형식이고 오늘 이전(오늘 포함)인 날짜만 받는다. 아니면 오늘."""
        value = str(value or "")
        return value if re.fullmatch(r"\d{8}", value) and value <= today() else today()


    def slot_of(ts=None):
        """시각 → 10분 칸 번호 (0:00~0:09 → 0, 23:50~23:59 → 143). 플래너 시간표 단위."""
        t = datetime.fromtimestamp(ts if ts is not None else time.time(), KST)
        return (t.hour * 60 + t.minute) // 10


    def new_id(n=6):
        return secrets.token_hex(n)


    def rate_limited(key, limit, window=60):
        n = db.execute("INCR", key)
        if n == 1:
            db.execute("EXPIRE", key, window)
        return n > limit


    def text(body, field, lo, hi, label):
        v = str(body.get(field) or "").strip()
        if not lo <= len(v) <= hi:
            raise ApiError(400, f"{label}은(는) {lo}~{hi}자로 입력해 주세요")
        return v


    def color(body, field="color"):
        v = str(body.get(field) or "")
        if not HEX_COLOR.fullmatch(v):
            raise ApiError(400, "색상 값이 올바르지 않아요")
        return v.lower()


    def optional(value, kind):
        """선택 입력값: 형식이 맞으면 그대로, 아니면 None."""
        if kind == "color":
            return value.lower() if isinstance(value, str) and HEX_COLOR.fullmatch(value) else None
        return value if isinstance(value, kind) else None
  planner.py: |
    """플래너: 과목 → 할 일(과목별 백로그) → 데일리 플래너(그날 할 일 선택). 지난 날짜는 조회만 한다.

    planner:{uid}            JSON {subjects: [...], tasks: [...]}
    daily:{uid}:{YYYYMMDD}   JSON {goalMin, taskIds, memo, timetable}
    시간표·D-DAY는 schedule.py
    """
    import json
    import threading

    from common import ApiError, color, days_ago, db, new_id, past_day, text, today
    from study import study_on

    MAX_SUBJECTS = 20
    MAX_TASKS = 300
    HISTORY_DAYS = 7
    lock = threading.Lock()   # 같은 사용자의 동시 수정이 서로 덮어쓰지 않도록


    def load(uid):
        raw = db.get(f"planner:{uid}")
        return json.loads(raw) if raw else {"subjects": [], "tasks": []}


    def new_daily():
        return {"goalMin": 120, "taskIds": [], "memo": "", "timetable": {}}


    def load_daily(uid, day=None):
        """예전 데이터에 없는 필드는 기본값으로 채운다"""
        raw = db.get(f"daily:{uid}:{day or today()}")
        return {**new_daily(), **(json.loads(raw) if raw else {})}


    def save(uid, planner=None, daily=None):
        if planner is not None:
            db.set(f"planner:{uid}", json.dumps(planner, ensure_ascii=False))
        if daily is not None:
            db.set(f"daily:{uid}:{today()}", json.dumps(daily))


    def view(uid, planner=None, daily=None, day=None):
        """day의 플래너 (기본: 오늘). editable은 오늘일 때만 True"""
        day = day or today()
        p = planner or load(uid)
        d = daily or load_daily(uid, day)
        return {"subjects": p["subjects"], "tasks": p["tasks"], "dday": p.get("dday"), "editable": day == today(),
                "day": {"date": day, **d}, "study": study_on(uid, day)}


    def find(items, item_id, label):
        for it in items:
            if it["id"] == item_id:
                return it
        raise ApiError(404, f"{label}을(를) 찾을 수 없어요")


    def desk_books(uid):
        """오늘 남은 할 일의 과목 색 목록 → 3D 책상 위 책 더미."""
        p, d = load(uid), load_daily(uid)
        colors = {s["id"]: s["color"] for s in p["subjects"]}
        tasks = {t["id"]: t for t in p["tasks"]}
        left = [tasks[i] for i in d["taskIds"] if i in tasks and not tasks[i]["done"]]
        return [colors.get(t["subjectId"], "#c8a27a") for t in left][:6]


    # ---------- 핸들러 ----------

    def get_planner(req):
        """?date=YYYYMMDD 로 지난 날짜도 볼 수 있다"""
        return view(req.uid, day=past_day(req.query.get("date")))


    def history(req):
        """최근 7일 요약: 공부시간, 목표, 그날 담은 할 일 수, 그날 완료한 할 일 수"""
        tasks = load(req.uid)["tasks"]
        days = []
        for n in range(HISTORY_DAYS - 1, -1, -1):
            day = days_ago(n)
            d = load_daily(req.uid, day)
            days.append({"date": day, "goalMin": d["goalMin"], "totalSec": study_on(req.uid, day)["totalSec"],
                         "planned": len(d["taskIds"]), "done": sum(t["doneAt"] == day for t in tasks)})
        return {"days": days}


    def create_subject(req):
        with lock:
            p = load(req.uid)
            if len(p["subjects"]) >= MAX_SUBJECTS:
                raise ApiError(400, f"과목은 {MAX_SUBJECTS}개까지 만들 수 있어요")
            p["subjects"].append({"id": new_id(4), "color": color(req.body),
                                  "name": text(req.body, "name", 1, 20, "과목 이름")})
            save(req.uid, p)
            return view(req.uid, p)


    def update_subject(req, sid):
        with lock:
            p = load(req.uid)
            s = find(p["subjects"], sid, "과목")
            if "name" in req.body:
                s["name"] = text(req.body, "name", 1, 20, "과목 이름")
            if "color" in req.body:
                s["color"] = color(req.body)
            save(req.uid, p)
            return view(req.uid, p)


    def delete_subject(req, sid):
        """과목을 지우면 그 과목의 할 일과 오늘 목록의 항목도 함께 지운다."""
        with lock:
            p, d = load(req.uid), load_daily(req.uid)
            find(p["subjects"], sid, "과목")
            gone = {t["id"] for t in p["tasks"] if t["subjectId"] == sid}
            p["subjects"] = [s for s in p["subjects"] if s["id"] != sid]
            p["tasks"] = [t for t in p["tasks"] if t["id"] not in gone]
            d["taskIds"] = [t for t in d["taskIds"] if t not in gone]
            save(req.uid, p, d)
            return view(req.uid, p, d)


    def create_task(req):
        with lock:
            p = load(req.uid)
            sid = req.body.get("subjectId")
            find(p["subjects"], sid, "과목")
            if len(p["tasks"]) >= MAX_TASKS:
                raise ApiError(400, f"할 일은 {MAX_TASKS}개까지 만들 수 있어요")
            task = {"id": new_id(4), "subjectId": sid, "done": False, "doneAt": None,
                    "title": text(req.body, "title", 1, 50, "할 일")}
            p["tasks"].append(task)
            d = None
            if req.body.get("addToday"):
                d = load_daily(req.uid)
                d["taskIds"].append(task["id"])
            save(req.uid, p, d)
            return view(req.uid, p, d)


    def update_task(req, tid):
        with lock:
            p = load(req.uid)
            t = find(p["tasks"], tid, "할 일")
            if "title" in req.body:
                t["title"] = text(req.body, "title", 1, 50, "할 일")
            if "done" in req.body:
                t["done"] = bool(req.body["done"])
                t["doneAt"] = today() if t["done"] else None
            save(req.uid, p)
            return view(req.uid, p)


    def delete_task(req, tid):
        with lock:
            p, d = load(req.uid), load_daily(req.uid)
            find(p["tasks"], tid, "할 일")
            p["tasks"] = [t for t in p["tasks"] if t["id"] != tid]
            d["taskIds"] = [t for t in d["taskIds"] if t != tid]
            save(req.uid, p, d)
            return view(req.uid, p, d)


    def put_daily(req):
        """오늘 목표 시간, 오늘 할 일 목록(과목 백로그에서 고른 task id), 오늘의 한마디를 저장."""
        with lock:
            p, d = load(req.uid), load_daily(req.uid)
            if "goalMin" in req.body:
                try:
                    d["goalMin"] = max(0, min(1440, int(req.body["goalMin"])))
                except (TypeError, ValueError):
                    raise ApiError(400, "목표 시간이 올바르지 않아요")
            if isinstance(req.body.get("taskIds"), list):
                valid = {t["id"] for t in p["tasks"]}
                d["taskIds"] = list(dict.fromkeys(i for i in req.body["taskIds"] if i in valid))
            if "memo" in req.body:
                d["memo"] = text(req.body, "memo", 0, 200, "한마디")
            save(req.uid, daily=d)
            return view(req.uid, p, d)
  redis_client.py: |
    """표준 라이브러리만으로 구현한 최소 Redis(RESP2) 클라이언트.

    - 스레드마다 연결 하나를 유지한다 (ThreadingHTTPServer 대응).
    - 연결이 끊기면 한 번 재연결 후 재시도한다.
    - 처음 명령을 보낼 때 연결하므로 Redis가 늦게 떠도 서버가 죽지 않는다.
    """
    import socket
    import threading


    class RedisError(Exception):
        pass


    class Redis:
        def __init__(self, host, port=6379, password=None, timeout=5):
            self.host = host
            self.port = int(port)
            self.password = password
            self.timeout = timeout
            self._local = threading.local()

        def _connect(self):
            sock = socket.create_connection((self.host, self.port), timeout=self.timeout)
            conn = (sock, sock.makefile("rb"))
            if self.password:
                self._send(conn, ("AUTH", self.password))
            self._local.conn = conn
            return conn

        def _drop(self):
            conn = getattr(self._local, "conn", None)
            self._local.conn = None
            if conn:
                try:
                    conn[1].close()
                    conn[0].close()
                except OSError:
                    pass

        def execute(self, *args):
            for attempt in (0, 1):
                conn = getattr(self._local, "conn", None)
                try:
                    if conn is None:
                        conn = self._connect()
                    return self._send(conn, args)
                except (OSError, ConnectionError):
                    self._drop()
                    if attempt:
                        raise

        def _send(self, conn, args):
            sock, rfile = conn
            out = [b"*%d\r\n" % len(args)]
            for a in args:
                b = a if isinstance(a, bytes) else str(a).encode()
                out.append(b"$%d\r\n%s\r\n" % (len(b), b))
            sock.sendall(b"".join(out))
            return self._read(rfile)

        def _read(self, rfile):
            line = rfile.readline()
            if not line:
                raise ConnectionError("redis connection closed")
            kind, rest = line[:1], line[1:-2]
            if kind == b"+":
                return rest.decode()
            if kind == b"-":
                raise RedisError(rest.decode())
            if kind == b":":
                return int(rest)
            if kind == b"$":
                n = int(rest)
                if n < 0:
                    return None
                return rfile.read(n + 2)[:-2].decode()
            if kind == b"*":
                n = int(rest)
                if n < 0:
                    return None
                return [self._read(rfile) for _ in range(n)]
            raise RedisError("unknown reply: %r" % line)

        # 자주 쓰는 명령 단축
        def get(self, k): return self.execute("GET", k)
        def set(self, k, v, *opts): return self.execute("SET", k, v, *opts)
        def delete(self, *ks): return self.execute("DEL", *ks)
        def hget(self, k, f): return self.execute("HGET", k, f)
        def hset(self, k, mapping):
            args = []
            for f, v in mapping.items():
                args += [f, v]
            return self.execute("HSET", k, *args)
        def hdel(self, k, *fs): return self.execute("HDEL", k, *fs)
        def hincrby(self, k, f, n): return self.execute("HINCRBY", k, f, n)

        def hgetall(self, k):
            flat = self.execute("HGETALL", k) or []
            return dict(zip(flat[0::2], flat[1::2]))
  rooms.py: |
    """공부방: 생성·목록·코드 입장, 하트비트로 상태 동기화.

    room:{rid}           hash  name, max, private, code, owner, created, last_active
    rooms                zset  생성 시각순 방 목록
    code:{CODE}          str   비공개 방 코드 → rid
    room:{rid}:allowed   set   비공개 방에 들어갈 수 있는 uid
    presence:{rid}       hash  uid → JSON(seat, status, ts, ...) / STALE_SECONDS 지나면 정리
    """
    import json
    import re
    import secrets
    import threading

    from auth import character_of
    from common import ApiError, db, new_id, now, optional, rate_limited, text
    from planner import desk_books
    from schedule import current_plan
    from study import add_study, study_today, total_today

    STATUSES = ("STUDYING", "AWAY", "BREAK", "IDLE")
    STALE_SECONDS = 20
    ROOM_IDLE_DAYS = 3
    CODE_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"  # 헷갈리는 0/O, 1/I 제외
    _lock = threading.Lock()   # 좌석 배정·인원 체크를 직렬화 (api replicas=1 전제)


    def room_view(rid, r):
        return {"id": rid, "name": r["name"], "max": int(r["max"]), "private": r["private"] == "1"}


    def is_allowed(rid, uid):
        return bool(db.execute("SISMEMBER", f"room:{rid}:allowed", uid))


    def load_room(rid, uid):
        r = db.hgetall(f"room:{rid}")
        if not r:
            raise ApiError(404, "방을 찾을 수 없어요")
        if r["private"] == "1" and not is_allowed(rid, uid):
            raise ApiError(403, "비공개 방이에요. 방 코드로 입장해 주세요")
        return r


    def active_members(rid):
        """presence 해시에서 오래된 항목을 정리하고 현재 인원을 돌려준다."""
        members, stale = {}, []
        for uid, raw in db.hgetall(f"presence:{rid}").items():
            m = json.loads(raw)
            if now() - m["ts"] > STALE_SECONDS:
                stale.append(uid)
            else:
                members[uid] = m
        if stale:
            db.hdel(f"presence:{rid}", *stale)
        return members


    def delete_room(rid, r):
        db.delete(f"room:{rid}", f"room:{rid}:allowed", f"presence:{rid}")
        if r.get("code"):
            db.delete(f"code:{r['code']}")
        db.execute("ZREM", "rooms", rid)


    def new_code(rid):
        """영문+숫자가 섞인 6자리 코드. SET NX로 중복을 막는다."""
        while True:
            code = "".join(secrets.choice(CODE_ALPHABET) for _ in range(6))
            if re.search(r"[A-Z]", code) and re.search(r"\d", code) and \
                    db.set(f"code:{code}", rid, "NX"):
                return code


    # ---------- 핸들러 ----------

    def list_rooms(req):
        """공개 방 + 내가 들어갈 수 있는 비공개 방. 오래 비어 있던 방은 정리한다."""
        out = []
        for rid in db.execute("ZREVRANGE", "rooms", 0, 199):
            r = db.hgetall(f"room:{rid}")
            if not r:
                db.execute("ZREM", "rooms", rid)
                continue
            count = len(active_members(rid))
            idle = now() - float(r.get("last_active") or r["created"])
            if count == 0 and idle > ROOM_IDLE_DAYS * 86400:
                delete_room(rid, r)
                continue
            mine = r["private"] == "1" and is_allowed(rid, req.uid)
            if r["private"] == "1" and not mine:
                continue
            out.append({**room_view(rid, r), "count": count, "code": r["code"] if mine else None})
        out.sort(key=lambda x: -x["count"])
        return {"rooms": out[:50]}


    def create_room(req):
        name = text(req.body, "name", 1, 20, "방 이름")
        max_members = req.body.get("max")
        if max_members not in (4, 6, 8):
            raise ApiError(400, "인원은 4, 6, 8명 중에서 골라 주세요")
        private = bool(req.body.get("private"))
        rid = new_id(4)
        code = new_code(rid) if private else ""
        r = {"name": name, "max": max_members, "private": int(private), "code": code,
             "owner": req.uid, "created": now(), "last_active": now()}
        db.hset(f"room:{rid}", r)
        db.execute("ZADD", "rooms", now(), rid)
        db.execute("SADD", f"room:{rid}:allowed", req.uid)
        return {"room": {"id": rid, "name": name, "max": max_members, "private": private,
                         "code": code or None}}


    def join_by_code(req):
        if rate_limited(f"rl:code:{req.uid}", 10):
            raise ApiError(429, "코드 입력이 너무 많아요. 1분 뒤 다시 시도해 주세요")
        code = str(req.body.get("code") or "").strip().upper()
        rid = db.get(f"code:{code}") if re.fullmatch(r"[A-Z0-9]{6}", code) else None
        if not rid:
            raise ApiError(404, "해당 코드의 방이 없어요")
        db.execute("SADD", f"room:{rid}:allowed", req.uid)
        return {"roomId": rid}


    def heartbeat(req, rid):
        """3초마다 호출: 내 좌석·상태를 보내고 방 전체 상태를 받는다."""
        b = req.body
        with _lock:
            r = load_room(rid, req.uid)
            capacity = int(r["max"])
            members = active_members(rid)
            prev = members.get(req.uid)
            if prev is None and len(members) >= capacity:
                raise ApiError(409, "방이 가득 찼어요")

            seat = optional(b.get("seat"), int)
            if seat is not None and not 0 <= seat < capacity:
                seat = None
            taken = seat is not None and any(
                m["seat"] == seat for uid, m in members.items() if uid != req.uid)
            if taken:
                seat = None
            status = b.get("status") if b.get("status") in STATUSES else "IDLE"
            if seat is None:
                status = "IDLE"   # 자리에 앉아야 공부를 시작할 수 있다

            t = now()
            # 지금 하는 일로 고른 할 일의 과목, 없으면 시간표의 지금 계획 과목으로 공부시간을 쌓는다
            plan = current_plan(req.uid, optional(b.get("taskId"), str))
            subject_id = plan and plan["subjectId"]
            if prev:
                add_study(req.uid, prev, t)
            members[req.uid] = {
                "seat": seat, "status": status, "ts": t,
                "subjectId": subject_id,
                "subjectColor": plan and plan["color"],
                "name": req.user["name"], "character": character_of(req.user),
                "plan": plan,   # 지금 하는 과목·할 일 → 이름표 아래에 표시
                "books": desk_books(req.uid),
            }
            db.hset(f"presence:{rid}", {req.uid: json.dumps(members[req.uid], ensure_ascii=False)})
            db.hset(f"room:{rid}", {"last_active": t})

        out = [{"id": uid, **{k: v for k, v in m.items() if k != "ts"}, "todaySec": total_today(uid)}
               for uid, m in members.items()]
        return {"room": {**room_view(rid, r), "code": r["code"] or None},
                "members": out, "seatTaken": taken, "me": study_today(req.uid)}


    def leave(req, rid):
        with _lock:
            raw = db.hget(f"presence:{rid}", req.uid)
            if raw:
                add_study(req.uid, json.loads(raw), now())
                db.hdel(f"presence:{rid}", req.uid)
        return {"ok": True}
